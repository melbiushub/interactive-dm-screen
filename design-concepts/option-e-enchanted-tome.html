<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option E — The Enchanted Tome</title>
<style>
:root{
  --void:#040507; --room:#0a0c12;
  --leather:#1c0f0a; --leather-hi:#3a1c12; --leather-dk:#0d0604;
  --page:#e4d6b6; --page-edge:#d2bd8e; --page-edge2:#c0a978; --ink:#241608; --ink-soft:#5a4227;
  --gilt:#c9a34e; --gilt-bright:#f0cd7e;
  --gem:#e0304f; --gem-bright:#ff5b78;
  --aura:#4fd6e8; --aura-deep:#0f5a68;
  --blood:#7a1620; --bloodbright:#a52332;
  --border:#7a6438;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,'Iowan Old Style','Times New Roman',serif;
  background:
    radial-gradient(ellipse 900px 700px at 50% 30%, rgba(79,214,232,.06), transparent 65%),
    radial-gradient(ellipse at 50% 110%, rgba(0,0,0,.9), transparent 60%),
    linear-gradient(160deg,var(--room),var(--void) 75%);
  display:flex;align-items:center;justify-content:center;overflow:hidden;padding:78px 16px 40px;
}
.caption{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.4px;color:#8fa0a6;z-index:90;text-align:center;max-width:90vw;}
.caption b{color:var(--aura);}

/* dim silhouettes of a book stack in the dark, echoing the game-asset reference */
.silhouette{position:fixed;bottom:-60px;width:220px;height:300px;border-radius:6px;filter:blur(10px);opacity:.5;pointer-events:none;z-index:0;}
.silhouette.l{left:-80px;background:linear-gradient(100deg,#0a0604,#1c0f0a 60%,#0a0604);transform:rotate(-10deg);}
.silhouette.r{right:-80px;background:linear-gradient(100deg,#0a0604,#1c0f0a 60%,#0a0604);transform:rotate(11deg);}

/* magical mist particles */
.motes{position:fixed;inset:0;pointer-events:none;z-index:0;}
.motes::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--aura) 0 1.4px,transparent 2.2px),radial-gradient(circle,var(--gem) 0 1px,transparent 1.6px);
  background-size:190px 320px,260px 380px;background-position:10% 0,60% 40%;opacity:.35;mix-blend-mode:screen;
  animation:drift 22s linear infinite;
}
@keyframes drift{from{background-position:10% 0,60% 40%;}to{background-position:10% -1300px,60% -1500px;}}
@media (prefers-reduced-motion: reduce){ .motes::after{animation:none;} }

.stage{position:relative;z-index:1;perspective:2600px;width:min(640px,92vw);margin:0 auto;}

/* ===== closed cover, magical glow, opens once ===== */
.closed{
  position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;aspect-ratio:3/4;cursor:pointer;
  transform-style:preserve-3d;transform-origin:left center;z-index:2;
  transition:transform 1.1s cubic-bezier(.6,0,.15,1), opacity .5s ease .5s;
}
.closed.opened{transform:translateX(-50%) rotateY(-150deg);opacity:0;pointer-events:none;}
.cover-face{
  position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(240,205,126,.1),transparent 55%),
    linear-gradient(160deg,var(--leather-hi),var(--leather) 55%,var(--leather-dk));
  box-shadow:0 40px 90px -24px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.06);
}
.aura{position:absolute;inset:-26px;border-radius:24px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse at 50% 50%, rgba(79,214,232,.35), transparent 68%);
  filter:blur(14px);animation:auraPulse 3.6s ease-in-out infinite;}
@keyframes auraPulse{0%,100%{opacity:.55;transform:scale(1);}50%{opacity:.9;transform:scale(1.05);}}
@media (prefers-reduced-motion: reduce){ .aura{animation:none;opacity:.7;} }

.filigree{position:absolute;inset:22px;border:1.5px solid var(--gilt);border-radius:6px;opacity:.8;}
.filigree::before{content:'';position:absolute;inset:8px;border:1px solid var(--gilt);border-radius:4px;opacity:.5;}
.fcorner{position:absolute;width:30px;height:30px;border:2px solid var(--gilt-bright);opacity:.85;}
.fcorner.tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
.fcorner.tr{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 6px 0 0;}
.fcorner.bl{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 6px;}
.fcorner.br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 6px 0;}

.emblem{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52%;height:34%;
  border:1.5px solid var(--gilt);border-radius:50% / 40%;display:flex;align-items:center;justify-content:center;}
.emblem::before,.emblem::after{content:'';position:absolute;width:1px;height:70%;background:var(--gilt);opacity:.6;}
.emblem::before{transform:rotate(28deg);} .emblem::after{transform:rotate(-28deg);}
.gem{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gem-bright),var(--gem) 60%,#5c0f1c 100%);
  box-shadow:0 0 10px 2px rgba(224,48,79,.6),inset 0 0 3px rgba(255,255,255,.5);animation:gemPulse 2.4s ease-in-out infinite;}
@keyframes gemPulse{0%,100%{box-shadow:0 0 8px 1px rgba(224,48,79,.5),inset 0 0 3px rgba(255,255,255,.5);}50%{box-shadow:0 0 16px 5px rgba(224,48,79,.8),inset 0 0 3px rgba(255,255,255,.6);}}
.gem.corner{position:absolute;width:9px;height:9px;}
.gem.corner.tl{top:26px;left:26px;} .gem.corner.tr{top:26px;right:26px;}
.gem.corner.bl{bottom:26px;left:26px;} .gem.corner.br{bottom:26px;right:26px;}

.clasp{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:34px;height:20px;
  background:linear-gradient(160deg,var(--gilt-bright),#8a6a2c);border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.6);}

.opentip{position:absolute;bottom:-38px;left:50%;transform:translateX(-50%);color:#8fa0a6;font-size:12.5px;letter-spacing:.5px;white-space:nowrap;}

/* ===== interior, revealed behind the cover ===== */
.interior{position:relative;opacity:0;transition:opacity .6s ease .7s;}
.interior.shown{opacity:1;}

.marginflip{
  position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--aura),var(--aura-deep) 75%);border:none;cursor:pointer;
  color:#04262b;font-size:20px;box-shadow:0 0 16px -2px rgba(79,214,232,.5),inset 0 1px 0 rgba(255,255,255,.3);z-index:5;
  transition:transform .25s cubic-bezier(.16,1,.3,1);}
.marginflip:hover{transform:translateY(-50%) scale(1.08);}
.marginflip:active{transform:translateY(-50%) scale(.94);}
.marginflip.prev{left:-60px;} .marginflip.next{right:-60px;}
.marginflip[disabled]{opacity:.25;pointer-events:none;}
@media(max-width:820px){.marginflip{display:none;}}

.leather-frame{
  position:relative;background:linear-gradient(160deg,var(--leather-hi),var(--leather) 55%,var(--leather-dk));
  border-radius:16px;padding:18px;box-shadow:0 55px 100px -26px rgba(0,0,0,.95),0 0 40px -12px rgba(79,214,232,.18),inset 0 0 0 1px rgba(0,0,0,.6);
}
.stage3d{position:relative;perspective:2200px;}
.pages{
  position:relative;min-height:440px;border-radius:6px;overflow:hidden;
  background:
    radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.35),transparent 40%),
    radial-gradient(ellipse at 88% 92%,rgba(90,60,20,.2),transparent 45%),
    var(--page);
  box-shadow:inset 0 0 50px rgba(90,60,20,.22),3px 3px 0 var(--page-edge),6px 6px 0 var(--page-edge2),8px 8px 16px -4px rgba(0,0,0,.55);
  transform-origin:center center;backface-visibility:hidden;transform-style:preserve-3d;
}
.pages.turning-out{animation:turnOut .5s cubic-bezier(.5,.02,.4,1) forwards;}
.pages.turning-in{animation:turnIn .52s cubic-bezier(.22,.85,.35,1) forwards;}
@keyframes turnOut{0%{transform:rotateY(0) translateZ(0);filter:brightness(1) saturate(1);}50%{transform:rotateY(-92deg) translateZ(60px);filter:brightness(.4) saturate(.6);}100%{transform:rotateY(-94deg) translateZ(0);filter:brightness(.28) saturate(.5);}}
@keyframes turnIn{0%{transform:rotateY(90deg) translateZ(0);filter:brightness(.28) saturate(.5);}45%{transform:rotateY(88deg) translateZ(60px);filter:brightness(.42) saturate(.6);}100%{transform:rotateY(0) translateZ(0);filter:brightness(1) saturate(1);}}
@media (prefers-reduced-motion: reduce){ .pages.turning-out,.pages.turning-in{animation:none !important;} }

.sheen{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;
  background:linear-gradient(100deg,transparent 30%,rgba(79,214,232,.35) 48%,rgba(255,255,255,.05) 54%,transparent 70%);mix-blend-mode:soft-light;}
.pages.turning-out .sheen{animation:sheenSweep .5s cubic-bezier(.5,.02,.4,1) forwards;}
.pages.turning-in .sheen{animation:sheenSweep .52s cubic-bezier(.22,.85,.35,1) forwards reverse;}
@keyframes sheenSweep{0%{opacity:0;background-position:-40% 0;}45%{opacity:.9;}55%{opacity:.9;}100%{opacity:0;background-position:60% 0;}}

.curl-shadow{position:absolute;top:0;bottom:0;width:110px;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(ellipse 76px 100% at 0% 50%, rgba(20,12,6,.55), transparent 70%);}
.curl-shadow.l{left:0;} .curl-shadow.r{right:0;transform:scaleX(-1);}
.pages.turning-out .curl-shadow,.pages.turning-in .curl-shadow{animation:curlPulse .5s ease forwards;}
@keyframes curlPulse{0%{opacity:0;}50%{opacity:1;}100%{opacity:0;}}

.pages::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:90px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(60,38,16,.3),transparent);pointer-events:none;z-index:2;}
.rune-ring{position:absolute;top:50%;left:50%;width:210px;height:210px;transform:translate(-50%,-50%);
  border:1px dashed rgba(79,214,232,.28);border-radius:50%;pointer-events:none;z-index:0;}
.rune-ring::before{content:'';position:absolute;inset:22px;border:1px solid rgba(79,214,232,.2);border-radius:50%;}
.gilt-frame{position:absolute;inset:16px;border:1px solid var(--gilt);box-shadow:inset 0 0 0 4px transparent,inset 0 0 0 5px rgba(201,163,78,.5);border-radius:3px;pointer-events:none;z-index:2;}
.corner-mark{position:absolute;width:8px;height:8px;background:var(--gem);transform:rotate(45deg);box-shadow:0 0 7px rgba(224,48,79,.55);z-index:3;pointer-events:none;}
.corner-mark.tl{top:8px;left:8px;} .corner-mark.tr{top:8px;right:8px;}
.corner-mark.bl{bottom:8px;left:8px;} .corner-mark.br{bottom:8px;right:8px;}

.leaf-text{position:relative;z-index:1;padding:42px 54px 48px;max-width:740px;margin:0 auto;}
.leaf-text h2{margin:0 0 4px;color:#4a1a10;font-size:23px;letter-spacing:.3px;font-weight:normal;font-variant:small-caps;}
.leaf-text .sub{margin:0 0 20px;color:var(--ink-soft);font-size:13px;font-style:italic;}
.leaf-text p:first-of-type::first-letter{font-family:Georgia,serif;font-size:50px;line-height:.75;float:left;padding:5px 8px 0 0;color:var(--gem);text-shadow:1px 1px 0 rgba(0,0,0,.12);}
.leaf-text p{line-height:1.65;margin:0 0 12px;}

.mock-card{background:rgba(90,60,20,.08);border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin:10px 0;}
.mock-row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap;}
.mock-btn{background:linear-gradient(160deg,#f3e2b6,#dcbb76 60%,#b3925a);border:1px solid var(--gilt);color:#4a2f10;padding:6px 12px;border-radius:4px;font-size:12px;cursor:default;box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);}
.hpbar{height:15px;background:#d2c090;border-radius:3px;overflow:hidden;border:1px solid var(--border);}
.hpfill{height:100%;background:linear-gradient(90deg,var(--blood),var(--bloodbright));}
.mock-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;border:1px solid var(--border);color:var(--ink-soft);}
.danger-box{background:rgba(122,22,32,.08);border-left:3px solid var(--bloodbright);border-radius:3px;padding:9px 13px;margin-top:8px;color:#6e1420;font-style:italic;font-size:13.5px;}
table.mock{width:100%;border-collapse:collapse;font-size:13px;}
table.mock td,table.mock th{border:1px solid var(--border);padding:6px 9px;text-align:left;}
table.mock th{background:rgba(122,22,32,.85);color:#f6e9d0;font-weight:normal;}

/* the gem is the table-of-contents trigger, echoing the cover's central stone */
.gembtn{position:absolute;top:-3px;left:50%;transform:translateX(-50%);z-index:6;cursor:pointer;width:26px;height:26px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gem-bright),var(--gem) 60%,#5c0f1c 100%);
  box-shadow:0 0 10px 2px rgba(224,48,79,.55),inset 0 0 3px rgba(255,255,255,.5);animation:gemPulse 2.4s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){ .gembtn{animation:none;} }
.gemhint{position:absolute;top:34px;left:50%;transform:translateX(-50%);font-size:10.5px;color:#8a6a2c;white-space:nowrap;opacity:0;transition:opacity .2s ease;pointer-events:none;}
.gembtn:hover + .gemhint{opacity:1;}

.toc{position:absolute;top:46px;left:50%;transform:translateX(-50%);width:min(320px,80vw);z-index:7;
  background:var(--page-edge);border:1px solid var(--gilt);border-radius:4px;box-shadow:0 24px 46px -14px rgba(0,0,0,.75),0 0 30px -10px rgba(79,214,232,.3);
  padding:8px;max-height:320px;overflow-y:auto;}
.toc[hidden]{display:none;}
.toc button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:3px;font-family:Georgia,serif;font-size:13px;color:var(--ink);padding:7px 10px;cursor:pointer;}
.toc button:hover{background:rgba(79,214,232,.16);}
.toc button.current{background:rgba(122,22,32,.14);color:#6e1420;font-weight:bold;}

.corner-flip{position:absolute;bottom:0;width:0;height:0;cursor:pointer;z-index:4;transition:transform .2s cubic-bezier(.16,1,.3,1);transform-origin:bottom;}
.corner-flip.left{left:0;border-style:solid;border-width:0 0 30px 30px;border-color:transparent transparent rgba(90,60,20,.32) transparent;}
.corner-flip.right{right:0;border-style:solid;border-width:0 30px 30px 0;border-color:transparent rgba(90,60,20,.32) transparent transparent;}
.corner-flip:hover{transform:scale(1.2) translateY(-2px);}
.corner-flip[disabled]{opacity:.25;pointer-events:none;}

.folio{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-soft);z-index:3;letter-spacing:.5px;}

@media(max-width:640px){ .leaf-text{padding:34px 22px 38px;} .leather-frame{padding:12px;} }
</style>
</head>
<body>
<div class="caption">Option E — <b>The Enchanted Tome</b> — dark, dramatic, glowing. Click the closed cover to open it, then flip through with the same 3D page-turn.</div>
<div class="silhouette l"></div><div class="silhouette r"></div>
<div class="motes"></div>

<div class="stage">
  <div class="closed" id="closed">
    <div class="aura"></div>
    <div class="cover-face">
      <div class="filigree"></div>
      <i class="fcorner tl"></i><i class="fcorner tr"></i><i class="fcorner bl"></i><i class="fcorner br"></i>
      <span class="gem corner tl"></span><span class="gem corner tr"></span><span class="gem corner bl"></span><span class="gem corner br"></span>
      <div class="emblem"><div class="gem"></div></div>
      <div class="clasp"></div>
    </div>
    <div class="opentip">click the cover to open</div>
  </div>

  <div class="interior" id="interior">
    <button class="marginflip prev" id="prevOuter" aria-label="Previous page">‹</button>
    <button class="marginflip next" id="nextOuter" aria-label="Next page">›</button>
    <div class="leather-frame">
      <div class="stage3d">
        <div class="pages" id="pages">
          <div class="rune-ring"></div>
          <div class="curl-shadow l"></div><div class="curl-shadow r"></div>
          <div class="sheen"></div>
          <div class="gilt-frame"></div>
          <i class="corner-mark tl"></i><i class="corner-mark tr"></i><i class="corner-mark bl"></i><i class="corner-mark br"></i>
          <div class="gembtn" id="gembtn"></div>
          <div class="gemhint">contents</div>
          <div class="toc" id="toc" hidden></div>
          <div class="leaf-text" id="leafText"></div>
          <div class="corner-flip left" id="prevCorner"></div>
          <div class="corner-flip right" id="nextCorner"></div>
          <div class="folio" id="folio"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PAGES = [
  {k:'overview',title:'Campaign at a Glance',sub:'A place to skim before a session',body:`
    <p>A drowned coastal city, one tide from ruin. The lighthouse keeper has stopped answering, and the tide charts on the harbor wall no longer agree with the sea.</p>
    <div class="mock-card"><div class="mock-row"><span class="mock-pill">Party</span> 4 characters, level 5</div>
    <div class="mock-row"><span class="mock-pill">Stakes</span> The low quarter floods for good if the wardstone fails</div></div>`},
  {k:'goals',title:'Player Goals &amp; Secrets',sub:'Sealed and secret — click to reveal',body:`
    <div class="mock-card"><b>The Protector</b><div class="mock-row" style="margin-top:6px;"><span class="mock-pill">Win</span> Everyone the party is trying to save, survives</div>
    <div class="mock-row"><span class="mock-pill">Fail</span> Someone they were protecting dies</div></div>`},
  {k:'combat',title:'Combat Tracker',sub:'Round 3 — Elira\'s turn',body:`
    <div class="mock-card"><div class="mock-row"><b>Elira</b> <span class="mock-pill">AC 15</span></div>
    <div class="hpbar"><div class="hpfill" style="width:64%;"></div></div>
    <div class="mock-row"><button class="mock-btn">Next Turn</button><button class="mock-btn">Dmg</button><button class="mock-btn">Heal</button></div></div>`},
  {k:'villain',title:'The Drowned Choir — Live Tracker',sub:'Bloodied at half HP',body:`
    <div class="mock-card"><div class="hpbar"><div class="hpfill" style="width:38%;"></div></div>
    <div class="mock-row"><span class="mock-pill">Legendary Resistance</span> ● ● ○</div>
    <div class="danger-box">Bloodied — the choir's voices crack into static.</div></div>`},
  {k:'stats',title:'Stat Blocks',sub:'Monsters and key NPCs, ready to read aloud',body:`
    <div class="mock-card"><table class="mock"><tr><th>Rot Sentinel</th><th></th></tr>
    <tr><td>AC / HP</td><td>16 / 68</td></tr><tr><td>Speed</td><td>30 ft, swim 30 ft</td></tr></table></div>`},
  {k:'notes',title:'DM Notes',sub:'Whatever you don\'t want to forget',body:`
    <p>The innkeeper is lying about the second key. Don't let the party leave town without noticing the tide chart on the wall.</p>`}
];
const REST = ['Locations','Traps & Encounters','Random Events','Climax Tracker','Party Tracker','NPC Relationships','Session Recap','Backup & Setup'];
REST.forEach(t=>PAGES.push({k:t.toLowerCase(),title:t,sub:'',body:`<p>This leaf will hold the real ${t} tool once the concept is wired into the working screen.</p>`}));

let idx = 0;
const pagesEl = document.getElementById('pages');
const leafText = document.getElementById('leafText');
const folio = document.getElementById('folio');
const toc = document.getElementById('toc');
const prevBtns = [document.getElementById('prevOuter'), document.getElementById('prevCorner')];
const nextBtns = [document.getElementById('nextOuter'), document.getElementById('nextCorner')];

function paint(){
  const p = PAGES[idx];
  leafText.innerHTML = `<h2>${p.title}</h2>${p.sub?`<p class="sub">${p.sub}</p>`:''}${p.body}`;
  folio.textContent = (idx+1) + ' / ' + PAGES.length;
  prevBtns.forEach(b=>b.disabled = idx===0);
  nextBtns.forEach(b=>b.disabled = idx===PAGES.length-1);
  renderToc();
}
function renderToc(){
  toc.innerHTML = PAGES.map((p,i)=>`<button class="${i===idx?'current':''}" data-i="${i}">${p.title.replace(/&amp;/g,'&')}</button>`).join('');
  toc.querySelectorAll('button').forEach(b=>b.onclick=()=>{ jumpTo(parseInt(b.dataset.i)); toc.hidden=true; });
}
function runFlip(newIdx){
  if(pagesEl.classList.contains('turning-out')) return;
  pagesEl.classList.add('turning-out');
  pagesEl.addEventListener('animationend', function h1(){
    pagesEl.removeEventListener('animationend',h1);
    idx = newIdx; paint();
    pagesEl.classList.remove('turning-out'); pagesEl.classList.add('turning-in');
    pagesEl.addEventListener('animationend', function h2(){
      pagesEl.removeEventListener('animationend',h2);
      pagesEl.classList.remove('turning-in');
    },{once:true});
  },{once:true});
}
function flip(delta){ const n=idx+delta; if(n<0||n>=PAGES.length) return; runFlip(n); }
function jumpTo(i){ if(i===idx||i<0||i>=PAGES.length) return; runFlip(i); }
prevBtns.forEach(b=>b.onclick=()=>flip(-1));
nextBtns.forEach(b=>b.onclick=()=>flip(1));
document.getElementById('gembtn').onclick=(e)=>{ e.stopPropagation(); toc.hidden=!toc.hidden; };
document.addEventListener('click',(e)=>{ if(!toc.hidden && !toc.contains(e.target) && e.target.id!=='gembtn') toc.hidden=true; });
document.addEventListener('keydown',(e)=>{ if(e.key==='ArrowLeft') flip(-1); if(e.key==='ArrowRight') flip(1); });
paint();

const closed = document.getElementById('closed');
const interior = document.getElementById('interior');
closed.addEventListener('click', function(){
  closed.classList.add('opened');
  setTimeout(()=>interior.classList.add('shown'), 550);
});
</script>
</body>
</html>
