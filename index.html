    radial-gradient(ellipse at 50% -10%, rgba(201,154,63,0.14), transparent 55%),

/* ---- Ambient glow orbs: drifting light sources, echoing glowing jars/lanterns ---- */
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1;}
.orb{position:absolute;border-radius:50%;filter:blur(70px);}
.orb1{width:380px;height:380px;top:-100px;left:-80px;background:radial-gradient(circle,var(--arcane),transparent 70%);opacity:0.28;animation:orbFloatA 16s ease-in-out infinite;}
.orb2{width:320px;height:320px;bottom:-90px;right:-60px;background:radial-gradient(circle,var(--gold),transparent 70%);opacity:0.22;animation:orbFloatB 20s ease-in-out infinite;}
.orb3{width:260px;height:260px;top:38%;right:6%;background:radial-gradient(circle,var(--ember),transparent 70%);opacity:0.20;animation:orbFloatC 18s ease-in-out infinite;}

<script>
const TABS = ["Overview","Goals & Secrets","Locations","Traps & Encounters","Random Events","Climax Tracker","Combat Tracker","Villain","Stat Blocks","Party Tracker","NPC Relationships","Session Recap","Notes","Backup & Setup"];
const SCHEMA_VERSION = 2;
const TEMPLATE_VERSION = '2.0.0';
const CAMPAIGNS_KEY = 'dmScreenCampaigns';
const LEGACY_KEY = 'dmScreenState';
let storageWarning = '';
function makeCampId(){ return 'camp'+Date.now()+Math.floor(Math.random()*100000); }
function loadCampaignsData(){
  try{
    const raw = localStorage.getItem(CAMPAIGNS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.campaigns && parsed.activeCampaignId && parsed.campaigns[parsed.activeCampaignId]) return parsed;
    }
    let legacyState = {};
    try{ legacyState = JSON.parse(localStorage.getItem(LEGACY_KEY)||'{}') || {}; }catch(e){}
    const id = makeCampId();
    return { campaigns: { [id]: { name: 'My Campaign', updatedAt: Date.now(), state: legacyState } }, activeCampaignId: id };
  }catch(e){
    storageWarning = 'Local storage is unavailable in this browser/context — your progress will NOT be saved automatically. Use Backup & Setup to export a .json backup manually before closing this tab.';
    const id = makeCampId();
    return { campaigns: { [id]: { name: 'My Campaign', updatedAt: Date.now(), state: {} } }, activeCampaignId: id };
  }
}
let campaignsData = loadCampaignsData();
let state = campaignsData.campaigns[campaignsData.activeCampaignId].state;
function saveCampaignsData(){
  try{
    campaignsData.campaigns[campaignsData.activeCampaignId].updatedAt = Date.now();
    localStorage.setItem(CAMPAIGNS_KEY, JSON.stringify(campaignsData));
    storageWarning = '';
  }catch(e){
    if(e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014)){
      storageWarning = 'Local storage is full — new changes are NOT being saved. Go to Backup & Setup and download a backup immediately, then delete old Session Recap entries to free up space.';
    } else {
      storageWarning = 'Local storage is unavailable in this browser/context — changes are NOT being saved automatically. Use Backup & Setup to export a .json backup manually.';
    }
  }
  updateStorageBanner();
}
function save(){ saveCampaignsData(); }
function playFlicker(){
  document.body.classList.add('flicker');
  setTimeout(()=>document.body.classList.remove('flicker'), 240);
}
function switchCampaign(id){
  if(!campaignsData.campaigns[id] || id===campaignsData.activeCampaignId) return;
  campaignsData.activeCampaignId = id;
  state = campaignsData.campaigns[id].state;
  saveCampaignsData();
  document.getElementById('sessionTitle').textContent = get('sessionTitle','INTERACTIVE DM SCREEN');
  document.getElementById('sessionSub').textContent = get('sessionSub','Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)');
  renderCampaignSwitcher();
  renderAll();
  playFlicker();
}
function createCampaign(){
  const id = makeCampId();
  campaignsData.campaigns[id] = { name: 'New Campaign', updatedAt: Date.now(), state: {} };
  campaignsData.activeCampaignId = id;
  state = campaignsData.campaigns[id].state;
  saveCampaignsData();
  document.getElementById('sessionTitle').textContent = 'INTERACTIVE DM SCREEN';
  document.getElementById('sessionSub').textContent = 'Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)';
  renderCampaignSwitcher();
  renderAll();
  playFlicker();
}
function renameCampaign(id, name){
  if(campaignsData.campaigns[id]){ campaignsData.campaigns[id].name = (name||'').trim() || 'Untitled Campaign'; saveCampaignsData(); renderCampaignSwitcher(); }
}
function deleteCampaign(id){
  const ids = Object.keys(campaignsData.campaigns);
  if(ids.length<=1){ alert('You need at least one campaign — create a new one before deleting this one.'); return; }
  if(!confirm(`Delete campaign "${campaignsData.campaigns[id].name}"? This cannot be undone.`)) return;
  delete campaignsData.campaigns[id];
  if(campaignsData.activeCampaignId===id){
    campaignsData.activeCampaignId = Object.keys(campaignsData.campaigns)[0];
    state = campaignsData.campaigns[campaignsData.activeCampaignId].state;
    document.getElementById('sessionTitle').textContent = get('sessionTitle','INTERACTIVE DM SCREEN');
    document.getElementById('sessionSub').textContent = get('sessionSub','Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)');
  }
  saveCampaignsData();
  renderCampaignSwitcher();
  renderAll();
}
function duplicateCampaign(id){
  const src = campaignsData.campaigns[id];
  const newId = makeCampId();
  campaignsData.campaigns[newId] = { name: src.name+' (Copy)', updatedAt: Date.now(), state: JSON.parse(JSON.stringify(src.state)) };
  saveCampaignsData();
  renderCampaignSwitcher();
}
function renderCampaignSwitcher(){
  const bar = document.getElementById('campaignBar');
  if(!bar) return;
  const camps = campaignsData.campaigns;
  const activeId = campaignsData.activeCampaignId;
  const ids = Object.keys(camps);
  let html = '<div class="seal-row">';
  ids.forEach(id=>{
    const c = camps[id];

// ---- Debounce (avoid a localStorage write on every keystroke in long text fields) ----
function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
}

// ---- Dice ----
function rollDiceStr(str){
  const m = String(str).match(/(\d+)\s*d\s*(\d+)\s*([+-]\s*\d+)?/i);
  if(!m) return null;
  const n=parseInt(m[1]), d=parseInt(m[2]), mod=m[3]?parseInt(m[3].replace(/\s+/g,'')):0;
  let total=mod, rolls=[];
  for(let i=0;i<n;i++){ const r=Math.floor(Math.random()*d)+1; rolls.push(r); total+=r; }
  return {total, rolls, mod, str};
}
function wireDiceButtons(logKey){
  document.querySelectorAll('[data-roll]').forEach(btn=>{
    btn.onclick=()=>{
      const res = rollDiceStr(btn.dataset.roll);
      if(!res) return;
      const out = document.getElementById(btn.dataset.rollout);
      if(out) out.textContent = `${res.total} (${res.rolls.join('+')}${res.mod?(res.mod>0?'+':'')+res.mod:''})`;
      if(logKey){
        const log = get(logKey, []);
        log.unshift(`Rolled ${btn.dataset.roll}${btn.dataset.rolllabel?' — '+btn.dataset.rolllabel:''}: ${res.total}`);
        set(logKey, log.slice(0,60));
        const box = document.getElementById(logKey+'Box');
        if(box) box.innerHTML = log.map(l=>`<div>• ${l}</div>`).join('');
      }
    };
  });
}

// ---- Timer ----
function fmtTime(s){
  if(s<0) s=0;
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
let timerInterval=null;
function tickTimer(){
  const box=document.getElementById('timerBox');
  const disp=document.getElementById('tDisplay');
  if(!box||!disp) return;
  const running = get('timerRunning', false);
  const endAt = get('timerEndAt', null);
  const remaining = get('timerRemaining', 0);
  let secs;
  if(running && endAt){
    secs = (endAt - Date.now())/1000;
    if(secs<=0){ secs=0; set('timerRunning',false); set('timerRemaining',0); clearInterval(timerInterval); timerInterval=null; }
  } else {
    secs = remaining;
  }
  disp.textContent = fmtTime(secs);
  box.classList.toggle('warn', secs>0 && secs<=60);
}
function initTimer(){
  document.getElementById('tMinutes').value = get('timerMinutesInput','');
  tickTimer();
  if(get('timerRunning',false) && !timerInterval){
    timerInterval = setInterval(tickTimer, 1000);
  }
  document.getElementById('tStart').onclick=()=>{
    let remaining = get('timerRemaining', 0);
    if(remaining<=0){
      const mins = parseFloat(document.getElementById('tMinutes').value)||0;
      remaining = mins*60;
    }
    if(remaining<=0) return;
    set('timerRemaining', remaining);
    set('timerEndAt', Date.now()+remaining*1000);
    set('timerRunning', true);
    if(!timerInterval) timerInterval=setInterval(tickTimer,1000);
    tickTimer();
  };
  document.getElementById('tPause').onclick=()=>{
    const running=get('timerRunning',false);
    if(running){
      const endAt=get('timerEndAt',Date.now());
      const remaining=Math.max(0,(endAt-Date.now())/1000);
      set('timerRemaining', remaining);
      set('timerRunning', false);
      clearInterval(timerInterval); timerInterval=null;
    }
    tickTimer();
  };
  document.getElementById('tReset').onclick=()=>{
    set('timerRunning', false);
    set('timerRemaining', 0);
    set('timerEndAt', null);
    clearInterval(timerInterval); timerInterval=null;
    tickTimer();
  };
  document.getElementById('tMinutes').oninput=(e)=>{ set('timerMinutesInput', e.target.value); };
}

    c.onclick=(e)=>{
      if(e.target.tagName==='INPUT' || e.target.closest('[contenteditable]') || e.target.closest('button')) return;
      const id=c.dataset.goal;
      set('goalFlip'+id, !get('goalFlip'+id,false));
      renderAll();
    };
  });
  document.querySelectorAll('input[data-assign]').forEach(inp=>{
    inp.onchange=()=>{
      const assign=get('goalAssign',{});
      assign[inp.dataset.assign]=inp.value;
      set('goalAssign',assign);
    };
  });
  document.querySelectorAll('[data-goalfield]').forEach(el=>{
    el.onblur=()=>{
      const goals=getGoalsList();
      const g=goals.find(x=>x.id===el.dataset.goalid);
      if(g){ g[el.dataset.goalfield]=el.textContent.trim(); set('goalsList',goals); renderAll(); }
    };
  });
  const addGoalBtn=document.getElementById('addGoalBtn');
  if(addGoalBtn) addGoalBtn.onclick=()=>{
    const goals=getGoalsList();
    goals.push({id:'g'+Date.now()+Math.floor(Math.random()*1000), n:'New Goal', win:'Describe the win condition.', fail:'Describe the fail condition.', success:'Describe success.', partial:'Describe partial success.', failure:'Describe failure.'});
    set('goalsList',goals);
    renderAll();
  };
  document.querySelectorAll('[data-delgoal]').forEach(b=>{
    b.onclick=()=>{
      let goals=getGoalsList();
      const g=goals.find(x=>x.id===b.dataset.delgoal);
      if(!confirm(`Delete goal "${g?.n||'this goal'}"? This cannot be undone.`)) return;
      goals=goals.filter(x=>x.id!==b.dataset.delgoal);
      set('goalsList',goals);
      renderAll();
    };
  });
}

 {id:'A', name:"Location A", desc:"Click to describe this location.",

// ---- Location sub-areas & maps (locref = "loc:A" for a preset, "custom:2" for a custom location) ----
function getSubsFor(locref){
  if(locref.startsWith('loc:')) return get('locSubs_'+locref.slice(4), []);
  const ci=parseInt(locref.slice(7));
  const c=get('customLocations',[]);
  return (c[ci] && c[ci].subs) || [];
}
function setSubsFor(locref, subs){
  if(locref.startsWith('loc:')){ set('locSubs_'+locref.slice(4), subs); return; }
  const ci=parseInt(locref.slice(7));
  const c=get('customLocations',[]);
  c[ci].subs = subs;
  set('customLocations', c);
}
function getMapFor(locref){
  if(locref.startsWith('loc:')) return get('locMap_'+locref.slice(4), null);
  const ci=parseInt(locref.slice(7));
  const c=get('customLocations',[]);
  return (c[ci] && c[ci].map) || null;
}
function setMapFor(locref, dataUrl){
  if(locref.startsWith('loc:')){ set('locMap_'+locref.slice(4), dataUrl); return; }
  const ci=parseInt(locref.slice(7));
  const c=get('customLocations',[]);
  c[ci].map = dataUrl;
  set('customLocations', c);
}
let mapFlash = '';
function processMapFile(file, callback){
  if(!file.type.startsWith('image/')){ mapFlash='That file is not an image.'; renderAll(); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1600;
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.82));
    };
    img.onerror = ()=>{ mapFlash='Could not read that image file.'; renderAll(); };
    img.src = e.target.result;
  };
  reader.onerror = ()=>{ mapFlash='Could not read that file.'; renderAll(); };
  reader.readAsDataURL(file);
}
function renderSubs(locref){
  const subs = getSubsFor(locref);
  let html = subs.map(s=>{
    const checked = s.checked || {};
    return `<div class="card" style="background:#20180c;margin-left:16px;border-left:2px solid var(--border);">
    <div class="row">
      <span class="editable" contenteditable="true" spellcheck="false" data-subfield="name" data-subid="${s.id}" data-locref="${locref}" style="font-weight:bold;flex:1;">${s.name}</span>
      <button class="del" data-subdel="${s.id}" data-locref="${locref}">remove</button>
    </div>
    <p class="editable" contenteditable="true" spellcheck="false" data-subfield="desc" data-subid="${s.id}" data-locref="${locref}">${s.desc}</p>
    <div class="checklist">${(s.items||[]).map((t,i)=>`<label><input type="checkbox" data-subitemcheck="${s.id}" data-locref="${locref}" data-i="${i}" ${checked[i]?'checked':''}> <span class="editable" contenteditable="true" spellcheck="false" data-subitemtext="${s.id}" data-locref="${locref}" data-i="${i}" onclick="event.stopPropagation()">${t}</span> <button class="del" data-subitemdel="${s.id}" data-locref="${locref}" data-i="${i}">remove</button></label>`).join('')}</div>
    <div class="addbar">
      <input type="text" placeholder="Add checklist line…" data-subadditem="${s.id}" data-locref="${locref}" style="flex:1;">
      <button class="act" data-subadditembtn="${s.id}" data-locref="${locref}">Add</button>
    </div>
    </div>`;
  }).join('');
  html += `<div class="addbar" style="margin-left:16px;">
    <input type="text" placeholder="New sub-location name…" data-newsubname="${locref}" style="flex:1;">
    <button class="act" data-addsubbtn="${locref}">+ Add Sub-Location</button>
  </div>`;
  return html;
}
function renderMapSection(locref){
  const mapUrl = getMapFor(locref);
  return `<div style="margin-top:10px;">
  <h4 style="margin:6px 0 4px;color:#c98a5a;">Map</h4>
  ${mapUrl?`<img src="${mapUrl}" style="max-width:100%;border:1px solid var(--border);border-radius:6px;display:block;margin-bottom:6px;">`:''}
  <div class="row">
    <input type="file" accept="image/*" data-mapfile="${locref}">
    <button class="act" data-mapupload="${locref}">${mapUrl?'Replace Map':'Upload Map'}</button>
    ${mapUrl?`<button class="del" data-mapremove="${locref}">Remove Map</button>`:''}
  </div>
  </div>`;
}

  html += '<p class="smallmuted">Click any name or description to edit it in place. Extra checklist lines, sub-locations, maps, and whole new locations can be added below — rename, delete, or add as many as your adventure needs.</p>';
  if(flash) html += `<p class="smallmuted">${flash}</p>`;
  LOCATIONS.forEach(loc=>{
    const nameOverride = get('locName_'+loc.id, loc.name);
    const descOverride = get('locDesc_'+loc.id, loc.desc);
    const extra = get('locExtra_'+loc.id, []);
    const locref = 'loc:'+loc.id;
    html += `<div class="card">
    <h3 style="margin-top:0">Location ${loc.id} — <span class="editable" contenteditable="true" data-locname="${loc.id}">${nameOverride}</span>
      <button class="act" data-clonelocpreset="${loc.id}" style="font-size:11px;">Clone</button></h3>
    <p class="editable" contenteditable="true" data-locdesc="${loc.id}">${descOverride}</p>
    ${checklist('loc_'+loc.id, loc.items, true)}
    ${extra.length?`<div class="checklist">${extra.map((t,i)=>`<label><input type="checkbox" data-clx="${loc.id}" data-i="${i}" ${get('locExtraChecked_'+loc.id,{})[i]?'checked':''}> ${t} <button class="del" data-delx="${loc.id}" data-i="${i}">remove</button></label>`).join('')}</div>`:''}
    <div class="addbar">
      <input type="text" placeholder="Add custom checklist line…" data-addextra="${loc.id}" style="flex:1;">
      <button class="act" data-addextrabtn="${loc.id}">Add</button>
    </div>
    <h4 style="margin:10px 0 4px;color:#c98a5a;">Sub-Locations</h4>
    ${renderSubs(locref)}
    ${renderMapSection(locref)}
    </div>`;
  });
  const custom = get('customLocations', []);
  custom.forEach((loc,ci)=>{
    const locref = 'custom:'+ci;
    html += `<div class="card">
    <h3 style="margin-top:0">Custom — <span class="editable" contenteditable="true" data-customname="${ci}">${loc.name}</span>
      <button class="act" data-cloneloccustom="${ci}" style="font-size:11px;">Clone</button>
      <button class="del" data-delcustom="${ci}">delete location</button></h3>
    <p class="editable" contenteditable="true" data-customdesc="${ci}">${loc.desc}</p>
    <div class="checklist">${(loc.items||[]).map((t,i)=>`<label><input type="checkbox" data-customcl="${ci}" data-i="${i}" ${loc.checked&&loc.checked[i]?'checked':''}> <span class="editable" contenteditable="true" spellcheck="false" data-customitemtext="${ci}" data-i="${i}" onclick="event.stopPropagation()">${t}</span> <button class="del" data-delcustomitem="${ci}" data-i="${i}">remove</button></label>`).join('')}</div>
    <div class="addbar">
      <input type="text" placeholder="Add checklist line…" data-addcustomitem="${ci}" style="flex:1;">
      <button class="act" data-addcustomitembtn="${ci}">Add</button>
    </div>
    <h4 style="margin:10px 0 4px;color:#c98a5a;">Sub-Locations</h4>
    ${renderSubs(locref)}
    ${renderMapSection(locref)}
    </div>`;
  });
  html += `<div class="card">
  <h3 style="margin-top:0">+ Add New Location</h3>
  <div class="addbar">
    <input type="text" id="newLocName" placeholder="Location name">
    <input type="text" id="newLocDesc" placeholder="Short description" style="flex:1;">
    <button class="act" id="addLocBtn">Add Location</button>
  </div>
  </div>`;
  return html;
}
function wireLocations(){
  document.querySelectorAll('[data-clonelocpreset]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.clonelocpreset;
      const loc=LOCATIONS.find(l=>l.id===id);
      const name=get('locName_'+id, loc.name);
      const desc=get('locDesc_'+id, loc.desc);
      const overrides=get('loc_'+id+'_txt', {});
      const items=loc.items.map((label,i)=> overrides[i+'']!==undefined?overrides[i+'']:label).concat(get('locExtra_'+id,[]));
      const custom=get('customLocations',[]);
      custom.push({name:name+' (Copy)', desc, items, checked:{}, subs: getSubsFor('loc:'+id).map(s=>({...s, id:'sub'+Date.now()+Math.floor(Math.random()*1000)+Math.floor(Math.random()*1000)})), map: getMapFor('loc:'+id)});
      set('customLocations',custom);
      renderAll();
    };
  });
  document.querySelectorAll('[data-cloneloccustom]').forEach(b=>{
    b.onclick=()=>{
      const ci=parseInt(b.dataset.cloneloccustom);
      const custom=get('customLocations',[]);
      const loc=custom[ci];
      custom.push({name:(loc.name||'Location')+' (Copy)', desc:loc.desc||'', items:[...(loc.items||[])], checked:{}, subs:(loc.subs||[]).map(s=>({...s, id:'sub'+Date.now()+Math.floor(Math.random()*1000)+Math.floor(Math.random()*1000)})), map: loc.map||null});
      set('customLocations',custom);
      renderAll();
    };
  });
  document.querySelectorAll('[data-subfield]').forEach(el=>{
    el.onblur=()=>{
      const locref=el.dataset.locref;
      const subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===el.dataset.subid);
      if(s){ s[el.dataset.subfield]=el.textContent.trim(); setSubsFor(locref, subs); }
    };
  });
  document.querySelectorAll('[data-subdel]').forEach(b=>{
    b.onclick=()=>{
      const locref=b.dataset.locref;
      let subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===b.dataset.subdel);
      if(!confirm(`Delete sub-location "${s?.name||'this area'}"? This cannot be undone.`)) return;
      subs=subs.filter(x=>x.id!==b.dataset.subdel);
      setSubsFor(locref, subs);
      renderAll();
    };
  });
  document.querySelectorAll('[data-subitemcheck]').forEach(cb=>{
    cb.onchange=()=>{
      const locref=cb.dataset.locref;
      const subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===cb.dataset.subitemcheck);
      if(s){ if(!s.checked) s.checked={}; s.checked[cb.dataset.i]=cb.checked; setSubsFor(locref, subs); }
    };
  });
  document.querySelectorAll('[data-subitemtext]').forEach(el=>{
    el.onblur=()=>{
      const locref=el.dataset.locref;
      const subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===el.dataset.subitemtext);
      if(s){ s.items[parseInt(el.dataset.i)]=el.textContent.trim(); setSubsFor(locref, subs); }
    };
  });
  document.querySelectorAll('[data-subitemdel]').forEach(b=>{
    b.onclick=()=>{
      const locref=b.dataset.locref;
      const subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===b.dataset.subitemdel);
      if(s){ s.items.splice(parseInt(b.dataset.i),1); setSubsFor(locref, subs); renderAll(); }
    };
  });
  document.querySelectorAll('[data-subadditembtn]').forEach(b=>{
    b.onclick=()=>{
      const locref=b.dataset.locref;
      const inp=document.querySelector(`[data-subadditem="${b.dataset.subadditembtn}"][data-locref="${locref}"]`);
      if(!inp.value.trim()) return;
      const subs=getSubsFor(locref);
      const s=subs.find(x=>x.id===b.dataset.subadditembtn);
      if(s){ if(!s.items) s.items=[]; s.items.push(inp.value.trim()); setSubsFor(locref, subs); renderAll(); }
    };
  });
  document.querySelectorAll('[data-addsubbtn]').forEach(b=>{
    b.onclick=()=>{
      const locref=b.dataset.addsubbtn;
      const inp=document.querySelector(`[data-newsubname="${locref}"]`);
      if(!inp.value.trim()) return;
      const subs=getSubsFor(locref);
      subs.push({id:'sub'+Date.now()+Math.floor(Math.random()*1000), name:inp.value.trim(), desc:'', items:[], checked:{}});
      setSubsFor(locref, subs);
      renderAll();
    };
  });
  document.querySelectorAll('[data-mapupload]').forEach(b=>{
    b.onclick=()=>{
      const locref=b.dataset.mapupload;
      const fileInput=document.querySelector(`[data-mapfile="${locref}"]`);
      const file=fileInput.files[0];
      if(!file){ mapFlash='Choose an image file first.'; renderAll(); return; }
      processMapFile(file, (dataUrl)=>{
        setMapFor(locref, dataUrl);
        mapFlash='';
        renderAll();
      });
    };
  });
  document.querySelectorAll('[data-mapremove]').forEach(b=>{
    b.onclick=()=>{
      if(!confirm('Remove this map image? This cannot be undone.')) return;
      setMapFor(b.dataset.mapremove, null);
      renderAll();
    };
  });
  document.querySelectorAll('[data-locname]').forEach(el=>{
    el.onblur=()=>set('locName_'+el.dataset.locname, el.textContent.trim());
  });
  document.querySelectorAll('[data-locdesc]').forEach(el=>{
    el.onblur=()=>set('locDesc_'+el.dataset.locdesc, el.textContent.trim());
  });
  document.querySelectorAll('[data-clx]').forEach(cb=>{
    cb.onchange=()=>{
      const id=cb.dataset.clx, i=cb.dataset.i;
      const obj=get('locExtraChecked_'+id,{});
      obj[i]=cb.checked;
      set('locExtraChecked_'+id,obj);
    };
  });
  document.querySelectorAll('[data-delx]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.delx, i=parseInt(b.dataset.i);
      const arr=get('locExtra_'+id,[]);
      arr.splice(i,1);
      set('locExtra_'+id,arr);
      renderAll();
    };
  });
  document.querySelectorAll('[data-addextrabtn]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.addextrabtn;
      const inp=document.querySelector(`[data-addextra="${id}"]`);
      if(!inp.value.trim()) return;
      const arr=get('locExtra_'+id,[]);
      arr.push(inp.value.trim());
      set('locExtra_'+id,arr);
      renderAll();
    };
  });
  document.querySelectorAll('[data-customname]').forEach(el=>{
    el.onblur=()=>{
      const custom=get('customLocations',[]);
      custom[el.dataset.customname].name=el.textContent.trim();
      set('customLocations',custom);
    };
  });
  document.querySelectorAll('[data-customdesc]').forEach(el=>{
    el.onblur=()=>{
      const custom=get('customLocations',[]);
      custom[el.dataset.customdesc].desc=el.textContent.trim();
      set('customLocations',custom);
    };
  });
  document.querySelectorAll('[data-customcl]').forEach(cb=>{
    cb.onchange=()=>{
      const custom=get('customLocations',[]);
      const ci=cb.dataset.customcl;
      if(!custom[ci].checked) custom[ci].checked={};
      custom[ci].checked[cb.dataset.i]=cb.checked;
      set('customLocations',custom);
    };
  });
  document.querySelectorAll('[data-customitemtext]').forEach(el=>{
    el.onblur=()=>{
      const custom=get('customLocations',[]);
      const ci=el.dataset.customitemtext, i=parseInt(el.dataset.i);
      custom[ci].items[i]=el.textContent.trim();
      set('customLocations',custom);
    };
  });
  document.querySelectorAll('[data-delcustomitem]').forEach(b=>{
    b.onclick=()=>{
      const custom=get('customLocations',[]);
      custom[b.dataset.delcustomitem].items.splice(parseInt(b.dataset.i),1);
      set('customLocations',custom);
      renderAll();
    };
  });
  document.querySelectorAll('[data-addcustomitembtn]').forEach(b=>{
    b.onclick=()=>{
      const ci=b.dataset.addcustomitembtn;
      const inp=document.querySelector(`[data-addcustomitem="${ci}"]`);
      if(!inp.value.trim()) return;
      const custom=get('customLocations',[]);
      custom[ci].items.push(inp.value.trim());
      set('customLocations',custom);
      renderAll();
    };
  });
  document.querySelectorAll('[data-delcustom]').forEach(b=>{
    b.onclick=()=>{
      const custom=get('customLocations',[]);
      const idx=parseInt(b.dataset.delcustom);
      if(!confirm(`Delete location "${custom[idx]?.name||'this location'}" and everything checked off in it? This cannot be undone.`)) return;
      custom.splice(idx,1);
      set('customLocations',custom);
      renderAll();
    };
  });
  const addLocBtn=document.getElementById('addLocBtn');
  if(addLocBtn) addLocBtn.onclick=()=>{
    const name=document.getElementById('newLocName').value.trim();
    const desc=document.getElementById('newLocDesc').value.trim();
    if(!name) return;
    const custom=get('customLocations',[]);
    custom.push({name, desc, items:[], checked:{}});
    set('customLocations',custom);
    renderAll();
  };
}

      if(c){ c.name=el.value; set('combatants',arr); }

      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combac);
      if(c){ c.ac=parseInt(el.value)||0; set('combatants',arr); }
    };
  });
  document.querySelectorAll('[data-combmaxhp]').forEach(el=>{
    el.onchange=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combmaxhp);
      if(c){ c.maxhp=parseInt(el.value)||1; set('combatants',arr); renderAll(); }

  });

      const c=arr.find(x=>x.id===b.dataset.combheal);

  });

  };

function wireMaligno(){
  const maxHPInput=document.getElementById('villainMaxHPInput');
  const maxHP = get('villainMaxHP', 100);
  document.querySelectorAll('[data-diff]').forEach(b=>{
    b.onclick=()=>{ set('villainDifficulty', b.dataset.diff); renderAll(); };
  });
  if(maxHPInput) maxHPInput.onchange=()=>{
    const v=Math.max(1,parseInt(maxHPInput.value)||1);
    set('villainMaxHP', v);
    set('villainHP', Math.min(get('villainHP',maxHP), v));
    renderAll();
  };
  const dmgBtn=document.getElementById('dmgApply');
  if(dmgBtn) dmgBtn.onclick=()=>{
    const v=parseInt(document.getElementById('dmgInput').value)||0;
    set('villainHP', Math.max(0, get('villainHP',maxHP)-v));
    renderAll();
  };
  const healBtn=document.getElementById('healApply');
  if(healBtn) healBtn.onclick=()=>{
    const v=parseInt(document.getElementById('dmgInput').value)||0;
    set('villainHP', Math.min(maxHP, get('villainHP',maxHP)+v));
    renderAll();
  };
  const resetBtn=document.getElementById('hpReset');
  if(resetBtn) resetBtn.onclick=()=>{ set('villainHP',maxHP); renderAll(); };
  const special=document.getElementById('specialToggle');
  if(special) special.onchange=()=>{ set('villainSpecialActive', special.checked); renderAll(); };
  const sti=document.getElementById('signatureTargetInput');
  if(sti) sti.onchange=()=>{ set('villainSignatureTarget', sti.value); };
  const clr=document.getElementById('clearString');
  if(clr) clr.onclick=()=>{ set('villainSignatureTarget',''); renderAll(); };
  const lu=document.getElementById('legUse');
  if(lu) lu.onclick=()=>{ set('legendaryUsed', Math.min(3, get('legendaryUsed',0)+1)); renderAll(); };
  const lr=document.getElementById('legReset');
  if(lr) lr.onclick=()=>{ set('legendaryUsed',0); renderAll(); };
  document.querySelectorAll('[data-legres]').forEach(el=>{
    el.onclick=()=>{
      const i=parseInt(el.dataset.legres);
      const cur=get('legResUsed',0);
      set('legResUsed', cur>=i? i-1 : i);
      renderAll();
    };
  });
  const lrr=document.getElementById('legresReset');
  if(lrr) lrr.onclick=()=>{ set('legResUsed',0); renderAll(); };
  const addSvBtn=document.getElementById('addSecondaryVillainBtn');
  if(addSvBtn) addSvBtn.onclick=()=>{
    const list=get('secondaryVillains',[]);
    list.push({id:'sv'+Date.now()+Math.floor(Math.random()*1000), name:'', maxhp:50, hp:50});
    set('secondaryVillains',list);
    renderAll();
  };
  document.querySelectorAll('[data-svname]').forEach(el=>{
    el.onchange=()=>{
      const list=get('secondaryVillains',[]);
      const v=list.find(x=>x.id===el.dataset.svname);
      if(v){ v.name=el.value; set('secondaryVillains',list); }
    };
  });
  document.querySelectorAll('[data-svmaxhp]').forEach(el=>{
    el.onchange=()=>{
      const list=get('secondaryVillains',[]);
      const v=list.find(x=>x.id===el.dataset.svmaxhp);
      if(v){ v.maxhp=parseInt(el.value)||1; v.hp=Math.min(v.hp,v.maxhp); set('secondaryVillains',list); renderAll(); }
    };
  });
  document.querySelectorAll('[data-svdmg]').forEach(b=>{
    b.onclick=()=>{
      const list=get('secondaryVillains',[]);
      const v=list.find(x=>x.id===b.dataset.svdmg);
      const amtEl=document.querySelector(`[data-svamt="${b.dataset.svdmg}"]`);
      const amt=parseInt(amtEl.value)||0;
      if(v){ v.hp=Math.max(0,v.hp-amt); set('secondaryVillains',list); renderAll(); }
    };
  });
  document.querySelectorAll('[data-svheal]').forEach(b=>{
    b.onclick=()=>{
      const list=get('secondaryVillains',[]);
      const v=list.find(x=>x.id===b.dataset.svheal);
      const amtEl=document.querySelector(`[data-svamt="${b.dataset.svheal}"]`);
      const amt=parseInt(amtEl.value)||0;
      if(v){ v.hp=Math.min(v.maxhp,v.hp+amt); set('secondaryVillains',list); renderAll(); }
    };
  });
  document.querySelectorAll('[data-svremove]').forEach(b=>{
    b.onclick=()=>{
      let list=get('secondaryVillains',[]);
      const v=list.find(x=>x.id===b.dataset.svremove);
      if(!confirm(`Remove "${v?.name||'this villain'}"? This cannot be undone.`)) return;
      list=list.filter(x=>x.id!==b.dataset.svremove);
      set('secondaryVillains',list);
      renderAll();
    };
  });
}

function renderNPCTrust(){
  const succ = get('trustSuccesses',0);
  const fail = get('trustFails',0);
  let succDots=''; for(let i=1;i<=3;i++) succDots+=`<div class="rnd ${i<=succ?'done':''}" data-trustsucc="${i}">${i}</div>`;

  let outcomeHtml;
  if(succ>=3){
    outcomeHtml = eb('trust_outcome_success','Trust earned — describe what this unlocks.').replace('class="editable"','class="editable readaloud"');
  } else if(fail>=3){
    outcomeHtml = eb('trust_outcome_fail','Trust broken — describe the consequence.').replace('class="editable"','class="editable danger"');
  } else {
    outcomeHtml = `<p class="smallmuted">In progress — ${succ} success${succ!==1?'es':''}, ${fail} fail${fail!==1?'s':''}. Needs 3 successes before 3 fails.</p>`;
  }
  const roster = getNPCRoster();
  const npcRows = roster.map(n=>`<div class="row">

      <button class="del" data-delnpc="${n.id}">remove</button>
    </div>`).join('');
  const allyCount = roster.filter(n=>n.status==='ally').length;
  const hostileCount = roster.filter(n=>n.status==='hostile').length;
  return `
  <h2 class="section">NPC Relationships</h2>

// ---- Session Recap Generator ----
function buildRecapSections(){
  const sections = [];
  const locLines = [];
  LOCATIONS.forEach(loc=>{
    const checked = get('loc_'+loc.id, {});
    const overrides = get('loc_'+loc.id+'_txt', {});
    const done = loc.items.map((label,i)=> checked[i+'']? (overrides[i+'']!==undefined?overrides[i+'']:label) : null).filter(Boolean);
    if(done.length){
      const name = get('locName_'+loc.id, loc.name);
      locLines.push(`<b>${name}</b> (${done.length}/${loc.items.length}): ${done.join('; ')}`);
    }
  });
  (get('customLocations',[])).forEach(loc=>{
    const done=(loc.items||[]).filter((t,i)=> loc.checked && loc.checked[i]);
    if(done.length) locLines.push(`<b>${loc.name}</b> (${done.length}/${(loc.items||[]).length}): ${done.join('; ')}`);
  });
  if(locLines.length) sections.push({title:'Locations Progress', lines:locLines});
  const assign = get('goalAssign', {});
  const goalLines = getGoalsList().map(a=> assign[a.id] ? `${assign[a.id]} — ${a.n}` : null).filter(Boolean);
  if(goalLines.length) sections.push({title:'Goals Assigned', lines:goalLines});
  const succ=get('trustSuccesses',0), fail=get('trustFails',0);
  if(succ>0||fail>0){
    let outcome = succ>=3?'Resolved — trust earned.':(fail>=3?'Resolved — trust broken.':'Still in progress.');
    sections.push({title:get('trust_title','NPC Trust Challenge'), lines:[`${succ} success(es), ${fail} fail(s). ${outcome}`]});
  }
  const npcLines = getNPCRoster().filter(n=>n.status!=='neutral').map(n=>`${n.name}: ${n.status==='ally'?'Ally':'Hostile'}`);
  if(npcLines.length) sections.push({title:'NPC Relationships', lines:npcLines});
  const trapLines=[];
  TRAPS.forEach(t=>{
    const trig=get('trap_'+t.id+'_trig',false), disarm=get('trap_'+t.id+'_disarm',false);
    if(trig||disarm) trapLines.push(`${get('trap_'+t.id+'_name',t.name)}: ${disarm?'Disarmed/Bypassed':''}${trig&&disarm?', ':''}${trig?'Triggered':''}`);
  });
  COURSES.forEach(c=>{
    const stage=get('course_'+c.id,0);
    if(stage>0) trapLines.push(`${get('course_'+c.id+'_name',c.name)}: reached Stage ${stage}/${c.stages}`);
  });
  if(trapLines.length) sections.push({title:'Traps & Encounter Courses', lines:trapLines});
  const tensionLvl=get('tensionLevel',0);
  if(tensionLvl>0) sections.push({title:'Tension', lines:[`Currently at "${TENSION[tensionLvl].name}" (${TENSION[tensionLvl].die})`]});
  const pRound=get('purgeRound',0), pLog=get('purgeLog',[]);
  if(pRound>0 || pLog.length){
    const lines=[];
    if(pRound>0) lines.push(`Currently on round ${pRound}/${get('climaxMaxRounds',10)}.`);
    pLog.slice(0,3).forEach(l=>lines.push(l));
    sections.push({title:'Climax', lines});
  }
  const malMax=get('villainMaxHP',100);
  const malHP=get('villainHP', malMax);
  if(malHP < malMax){
    sections.push({title:get('villain_name','Villain'), lines:[`${malHP}/${malMax} HP.${get('villainSignatureTarget','')?(' Signature ability currently on: '+get('villainSignatureTarget','')+'.'):''}`]});
  }
  const secondaryVillains = (get('secondaryVillains',[])).filter(v=>v.hp<v.maxhp);
  if(secondaryVillains.length) sections.push({title:'Secondary Villains', lines: secondaryVillains.map(v=>`${v.name||'Unnamed'}: ${v.hp}/${v.maxhp} HP`)});
  const combatants=get('combatants',[]);
  if(combatants.length) sections.push({title:'Combat Left Mid-Fight', lines:[`Round ${get('combatRound',1)}: `+combatants.map(c=>`${c.name} (${c.hp}/${c.maxhp} HP)`).join(', ')]});
  const partyLines=[];
  (get('partyMembers',[])).forEach(m=>{
    if(m.name) partyLines.push(`${m.name}: ${m.hp}/${m.maxhp} HP${m.exh>0?`, Exhaustion ${m.exh}`:''}`);
  });
  if(partyLines.length) sections.push({title:'Party Status', lines:partyLines});
  return sections;
}
function renderRecap(){
  const sections = buildRecapSections();
  const log = get('sessionRecaps', []);
  let html = `<h2 class="section">Session Recap Generator</h2>
  <p class="smallmuted">Auto-compiled from everything checked, tracked, and logged elsewhere in this document — nothing to fill in by hand. Save one at the end of each session to build a running "story so far."</p>
  <div class="card">
  <h3 style="margin-top:0">Where We Left Off</h3>`;
  if(!sections.length){
    html += '<p class="smallmuted">Nothing tracked yet — as you check off objectives, trigger traps, advance the climax, etc., this recap fills itself in automatically.</p>';
  } else {
    sections.forEach(s=>{
      html += `<h4 style="margin:12px 0 4px;color:#c98a5a;">${s.title}</h4><ul style="margin:0;font-size:14px;">${s.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
    });
  }
  html += `</div>
  <div class="card">
  <h3 style="margin-top:0">Opening Narration (optional, hand-written)</h3>
  <p class="smallmuted">Write a short in-character "previously on..." to read aloud at the top of next session. This does not auto-update — it's yours to edit.</p>
  ${eb('recapNarration','Click to write your opening narration for next session…')}
  </div>
  <div class="card">
  <h3 style="margin-top:0">Save to Session Log</h3>
  <div class="row">
    <input type="text" id="recapLabel" placeholder="Session label (e.g. Session 3)" value="Session ${log.length+1}" style="flex:1;">
    <button class="act" id="saveRecapBtn">Save Today's Recap</button>
  </div>
  </div>`;
  if(log.length){
    html += `<h3>Session Log (${log.length})</h3>`;
    log.slice().reverse().forEach((entry,ri)=>{
      const i = log.length-1-ri;
      html += `<div class="card">
      <div class="row"><b>${entry.label}</b><span class="smallmuted">${entry.date}</span><button class="del" data-delrecap="${i}">delete</button></div>
      ${entry.sections.map(s=>`<div><b style="color:#c98a5a;">${s.title}:</b> ${s.lines.join('; ')}</div>`).join('')}
      ${entry.narration?`<div class="readaloud" style="margin-top:8px;">${entry.narration}</div>`:''}
      </div>`;
    });
  }
  return html;
}
function wireRecap(){
  const saveBtn=document.getElementById('saveRecapBtn');
  if(saveBtn) saveBtn.onclick=()=>{
    const label=document.getElementById('recapLabel').value.trim()||('Session '+(get('sessionRecaps',[]).length+1));
    const sections=buildRecapSections();
    const narration=get('recapNarration','');
    const log=get('sessionRecaps',[]);
    log.push({label, date:new Date().toLocaleDateString(), sections, narration: narration==='Click to write your opening narration for next session…'?'':narration});

    b.onclick=()=>{

      log.splice(idx,1);
      set('sessionRecaps',log);
      renderAll();
    };
  });
}

let importFlash = '';
function doExportBackup(){
  const payload = { schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), campaigns: campaignsData.campaigns, activeCampaignId: campaignsData.activeCampaignId };
  const dataStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const titleSlug = (get('sessionTitle','dm_screen')||'dm_screen').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const dateSlug = new Date().toISOString().slice(0,10);
  a.download = `${titleSlug}_backup_${dateSlug}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  return `

function wireBackup(){
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick=doExportBackup;
  const importBtn=document.getElementById('importBtn');
  if(importBtn) importBtn.onclick=()=>{
    const fileInput=document.getElementById('importFile');
    const file=fileInput.files[0];
    if(!file){ importFlash='Choose a .json backup file first.'; renderAll(); return; }
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(parsed && typeof parsed==='object' && parsed.campaigns && typeof parsed.campaigns==='object' && parsed.activeCampaignId){
          if(typeof parsed.schemaVersion==='number' && parsed.schemaVersion>SCHEMA_VERSION){
            importFlash=`Restored — but this backup was made with a newer template (schema v${parsed.schemaVersion}) than this file (v${SCHEMA_VERSION}). Some newer fields may not display correctly here; consider downloading the latest template.`;
          } else {
            importFlash='Backup restored successfully.';
          }
          campaignsData = { campaigns: parsed.campaigns, activeCampaignId: parsed.campaigns[parsed.activeCampaignId] ? parsed.activeCampaignId : Object.keys(parsed.campaigns)[0] };
          state = campaignsData.campaigns[campaignsData.activeCampaignId].state;
        } else if(parsed && typeof parsed==='object' && parsed.state && typeof parsed.state==='object'){
          const id = makeCampId();
          campaignsData = { campaigns: { [id]: { name:'Restored Campaign', updatedAt: Date.now(), state: parsed.state } }, activeCampaignId: id };
          state = campaignsData.campaigns[id].state;
          importFlash='Backup restored (older single-campaign file — loaded as "Restored Campaign").';
        } else if(parsed && typeof parsed==='object'){
          const id = makeCampId();
          campaignsData = { campaigns: { [id]: { name:'Restored Campaign', updatedAt: Date.now(), state: parsed } }, activeCampaignId: id };
          state = campaignsData.campaigns[id].state;
          importFlash='Backup restored (older unversioned file — loaded as "Restored Campaign").';
        } else {
          throw new Error('unrecognized backup shape');
        }
        saveCampaignsData();
        document.getElementById('sessionTitle').textContent = get('sessionTitle','INTERACTIVE DM SCREEN');
        document.getElementById('sessionSub').textContent = get('sessionSub','Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)');
        renderCampaignSwitcher();
      }catch(err){
        importFlash='Could not read that file — is it a valid backup .json?';
      }
      renderAll();
    };
    reader.onerror=()=>{ importFlash='Could not read that file.'; renderAll(); };
    reader.readAsText(file);
  };
  const resetBtn=document.getElementById('resetAllBtn');
  if(resetBtn) resetBtn.onclick=()=>{
    if(!confirm('This permanently erases all saved progress in the active campaign — every checkbox, HP change, note, and log. Other campaigns are not affected. This cannot be undone. Continue?')) return;
    campaignsData.campaigns[campaignsData.activeCampaignId].state = {};
    state = campaignsData.campaigns[campaignsData.activeCampaignId].state;
    saveCampaignsData();
    document.getElementById('sessionTitle').textContent = 'INTERACTIVE DM SCREEN';
    document.getElementById('sessionSub').textContent = 'Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)';
    renderCampaignSwitcher();
    renderAll();
  };
}
