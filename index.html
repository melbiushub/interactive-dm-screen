<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>INTERACTIVE DM SCREEN — Blank Template</title>
<style>
:root{
  --bg:#0f0e1a; --panel:#161427; --panel2:#1d1a33; --gold:#c9a84c; --red:#7a1313; --redbright:#b3251f;
  --text:#e8e3d0; --muted:#9b95b5; --border:#3a3458;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Georgia','Times New Roman',serif;}
header{background:linear-gradient(180deg,#1a1730,#0f0e1a);border-bottom:2px solid var(--gold);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px;}
header h1{margin:0;color:var(--gold);font-size:22px;letter-spacing:2px;font-style:italic;outline:none;}
header h1[contenteditable]:hover{border-bottom:1px dashed var(--gold);}
header .sub{color:var(--muted);font-size:12px;}
.timerbox{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--gold);border-radius:6px;padding:6px 12px;}
.timerbox .tdisplay{font-size:22px;color:var(--gold);min-width:80px;text-align:center;letter-spacing:1px;}
.timerbox.warn .tdisplay{color:#f3c8c8;}
.timerbox input[type=number]{width:50px;}
.editable{outline:none;}
.editable[contenteditable="true"]:hover{box-shadow:inset 0 -1px 0 0 var(--gold);}
.editable[contenteditable="false"]{cursor:default;}
.del:disabled,button.act:disabled{opacity:0.35;cursor:not-allowed;}
#modeToggleBtn.sel{background:var(--redbright);border-color:var(--gold);color:#fff;}
.del{background:none;border:1px solid var(--redbright);color:#f3c8c8;border-radius:4px;cursor:pointer;font-size:11px;padding:2px 7px;}
.del:hover{background:var(--redbright);color:#fff;}
.addbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.addbar input,.addbar textarea{background:#0f0e1a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px;font-family:inherit;}
nav{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);padding:8px 16px;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:49;}
nav button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:8px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;letter-spacing:0.5px;}
nav button.active{background:var(--red);border-color:var(--gold);color:#fff;}
nav button:hover{border-color:var(--gold);}
main{max-width:1100px;margin:0 auto;padding:20px 24px 80px;}
.tab{display:none;}
.tab.active{display:block;}
h2.section{color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:6px;letter-spacing:1px;}
h3{color:#d6a8a0;margin-top:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
.danger{background:#2a1212;border:1px solid var(--redbright);color:#f3c8c8;padding:10px 14px;border-radius:6px;font-style:italic;margin:10px 0;}
.readaloud{background:#1c1830;border-left:3px solid var(--gold);padding:10px 14px;font-style:italic;color:#dcd6f0;margin:10px 0;}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;}
th,td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;}
th{background:var(--red);color:#fff;}
tr:nth-child(even){background:#1a1730;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}.grid3{grid-template-columns:1fr;}}
.statblock{background:#1b1730;border:1px solid var(--gold);border-radius:6px;padding:14px;}
.statblock h4{margin:0 0 6px;color:var(--gold);font-style:italic;}
.hpbar{height:18px;background:#3a1414;border-radius:4px;overflow:hidden;border:1px solid var(--border);margin:4px 0;}
.hpfill{height:100%;background:linear-gradient(90deg,#7a1313,#b3251f);transition:width .2s;}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap;}
input[type=number]{width:70px;background:#0f0e1a;color:var(--text);border:1px solid var(--border);padding:4px;border-radius:4px;}
input[type=text]{background:#0f0e1a;color:var(--text);border:1px solid var(--border);padding:4px;border-radius:4px;font-family:inherit;}
button.act{background:var(--panel2);border:1px solid var(--gold);color:var(--gold);padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;}
button.act:hover{background:var(--red);color:#fff;}
button.act.sel{background:var(--red);color:#fff;}
.toggle{cursor:pointer;user-select:none;}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;border:1px solid var(--border);margin-left:6px;}
.pill.on{background:var(--red);border-color:var(--gold);color:#fff;}
.goal-card{background:#1b1730;border:1px solid var(--gold);border-radius:8px;padding:14px;cursor:pointer;position:relative;min-height:90px;}
.goal-card .back{display:none;}
.goal-card.flipped .front{display:none;}
.goal-card.flipped .back{display:block;}
.flag{color:#aaa;font-size:11px;}
.checklist label{display:block;margin:4px 0;}
.checklist input{margin-right:8px;}
.purge-track{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0;}
.rnd{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:#1a1730;}
.rnd.done{background:var(--red);border-color:var(--gold);color:#fff;}
.rnd.fail.done{background:#2a1212;border-color:var(--redbright);color:#f3c8c8;}
.log{background:#0f0e1a;border:1px solid var(--border);border-radius:6px;padding:8px;height:140px;overflow-y:auto;font-size:13px;color:var(--muted);}
.die{font-size:48px;text-align:center;color:var(--gold);margin:10px 0;}
.notes{width:100%;min-height:80px;background:#0f0e1a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:inherit;}
.quote{font-style:italic;color:#b89aa0;text-align:center;margin:18px 0;}
.smallmuted{color:var(--muted);font-size:12px;}
.tensionmeter{display:flex;gap:4px;margin:10px 0;}
.tensionseg{flex:1;height:14px;border-radius:3px;background:#2a2545;border:1px solid var(--border);}
.tensionseg.on{background:linear-gradient(90deg,var(--red),var(--redbright));border-color:var(--gold);}
.trapcard{border-left:3px solid var(--redbright);}
.trapcard.disarmed{border-left:3px solid #4a7a4a;opacity:0.75;}
.trapcard.triggered{border-left:3px solid var(--gold);}
.diceresult{color:var(--gold);font-weight:bold;margin-left:8px;}
.legres{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#1a1730;color:var(--gold);font-size:12px;}
.legres.spent{background:#2a1212;color:#5a5060;border-color:var(--border);}
.pctag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--muted);margin-left:6px;}
td,th,.editable,.card,.statblock,.goal-card,.trapcard{overflow-wrap:anywhere;}
@media(max-width:480px){
  .rnd{width:38px;height:38px;}
  .legres{width:30px;height:30px;}
  button.act,.del{padding:7px 12px;font-size:13px;}
  nav button{padding:9px 12px;}
}
.onboarding{background:#1c1830;border:1px solid var(--gold);border-radius:8px;padding:16px;margin-bottom:14px;}
.onboarding h3{margin-top:0;}
@media print{
  body{background:#fff !important;color:#111 !important;}
  header .timerbox,nav,#storageBanner,button.act,.del,.addbar,input[type=file],.onboarding,#printBtn{display:none !important;}
  main{max-width:100%;padding:0;}
  .card,.statblock,.goal-card,.trapcard{background:#fff !important;border:1px solid #999 !important;color:#111 !important;break-inside:avoid;}
  h1,h2.section,h3,h4{color:#111 !important;}
  .smallmuted,.flag{color:#555 !important;}
  .danger{background:#fff !important;border:1px solid #900 !important;color:#900 !important;}
  .readaloud{background:#fff !important;border-left:3px solid #999 !important;color:#111 !important;}
  th{background:#ddd !important;color:#111 !important;}
  tr:nth-child(even){background:#f5f5f5 !important;}
  input[type=text],input[type=number]{border:1px solid #999 !important;background:#fff !important;color:#111 !important;}
  .hpbar{border:1px solid #999 !important;}
  .rnd{border:1px solid #999 !important;background:#fff !important;color:#111 !important;}
  .rnd.done{background:#ddd !important;}
  .goal-card .front{display:none !important;}
  .goal-card .back{display:block !important;}
  details:not([open]) summary{color:#111 !important;}
}
</style>
</head>
<body>
<header>
  <div><h1 id="sessionTitle" contenteditable="true" spellcheck="false">INTERACTIVE DM SCREEN</h1><div class="sub" id="sessionSub" contenteditable="true" spellcheck="false">Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)</div></div>
  <div class="timerbox" id="timerBox">
    <span class="tdisplay" id="tDisplay">00:00</span>
    <input type="number" id="tMinutes" min="0" placeholder="min" style="width:46px;">
    <button class="act" id="tStart">Start</button>
    <button class="act" id="tPause">Pause</button>
    <button class="act" id="tReset">Reset</button>
  </div>
  <button class="act" id="printBtn" title="Print the currently open tab">Print This Tab</button>
  <button class="act" id="modeToggleBtn" title="Play Mode locks all text and delete buttons so nothing gets accidentally changed or removed mid-session"></button>
</header>
<div id="storageBanner" style="display:none;"></div>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const TABS = ["Overview","Goals & Secrets","Locations","Traps & Encounters","Random Events","Climax Tracker","Combat Tracker","Villain","Stat Blocks","Party Tracker","NPC Relationships","Session Recap","Notes","Backup & Setup"];
const SCHEMA_VERSION = 1;
const TEMPLATE_VERSION = '1.3.0';
let storageWarning = '';
let state = {};
try{
  state = JSON.parse(localStorage.getItem('dmScreenState')||'{}');
}catch(e){
  state = {};
  storageWarning = 'Local storage is unavailable in this browser/context — your progress will NOT be saved automatically. Use Backup & Setup to export a .json backup manually before closing this tab.';
}
function save(){
  try{
    localStorage.setItem('dmScreenState', JSON.stringify(state));
    storageWarning = '';
  }catch(e){
    if(e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014)){
      storageWarning = 'Local storage is full — new changes are NOT being saved. Go to Backup & Setup and download a backup immediately, then delete old Session Recap entries to free up space.';
    } else {
      storageWarning = 'Local storage is unavailable in this browser/context — changes are NOT being saved automatically. Use Backup & Setup to export a .json backup manually.';
    }
  }
  updateStorageBanner();
}
function updateStorageBanner(){
  const el = document.getElementById('storageBanner');
  if(!el) return;
  if(storageWarning){
    el.style.display='block';
    el.style.margin='0';
    el.style.borderRadius='0';
    el.style.textAlign='center';
    el.style.background='#2a1212';
    el.style.borderBottom='1px solid var(--redbright)';
    el.style.color='#f3c8c8';
    el.style.padding='8px 16px';
    el.style.fontStyle='italic';
    el.textContent = storageWarning;
  } else {
    el.style.display='none';
  }
}
function get(k,d){ return state[k]!==undefined?state[k]:d; }
function set(k,v){ state[k]=v; save(); }

// ---- Generic edit-in-place helpers: every ed()/eb() field is a state-backed override ----
function ed(key, def){ const v=get(key,def); return `<span class="editable" contenteditable="true" spellcheck="false" data-edit="${key}">${v}</span>`; }
function eb(key, def){ const v=get(key,def); return `<div class="editable" contenteditable="true" spellcheck="false" data-edithtml="${key}">${v}</div>`; }
function wireEditables(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onblur=()=>set(el.dataset.edit, el.textContent.trim());
  });
  document.querySelectorAll('[data-edithtml]').forEach(el=>{
    el.onblur=()=>set(el.dataset.edithtml, el.innerHTML.trim());
  });
}

function initHeader(){
  const title=document.getElementById('sessionTitle');
  const sub=document.getElementById('sessionSub');
  title.textContent = get('sessionTitle','INTERACTIVE DM SCREEN');
  sub.textContent = get('sessionSub','Your Campaign Name · DM Control Screen · Fully Customizable · Compatible with 5th Edition (2024 rules)');
  title.onblur=()=>set('sessionTitle', title.textContent.trim()||'INTERACTIVE DM SCREEN');
  sub.onblur=()=>set('sessionSub', sub.textContent.trim());
  const printBtn=document.getElementById('printBtn');
  if(printBtn) printBtn.onclick=()=>window.print();
  const modeBtn=document.getElementById('modeToggleBtn');
  if(modeBtn) modeBtn.onclick=()=>{ set('playMode', !get('playMode',false)); applyEditLock(); };
}
// Play Mode locks every text field and delete button so nothing gets accidentally changed or removed mid-session.
// Gameplay controls (checkboxes, dice, HP, round trackers, Add/Clone) stay active — only editing existing text and deleting are blocked.
function applyEditLock(){
  const playMode = get('playMode', false);
  document.querySelectorAll('[contenteditable]').forEach(el=>{ el.contentEditable = playMode ? 'false' : 'true'; });
  document.querySelectorAll('.del').forEach(btn=>{ btn.disabled = playMode; });
  const modeBtn=document.getElementById('modeToggleBtn');
  if(modeBtn){
    modeBtn.textContent = playMode ? 'Play Mode (locked)' : 'Edit Mode (unlocked)';
    modeBtn.classList.toggle('sel', playMode);
  }
}
// Auto-expand every collapsed <details> for print, then restore afterward so on-screen state is untouched.
window.addEventListener('beforeprint', ()=>{
  document.querySelectorAll('details').forEach(d=>{ d.dataset.wasOpen = d.open ? '1' : '0'; d.open = true; });
});
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('details').forEach(d=>{ d.open = d.dataset.wasOpen === '1'; delete d.dataset.wasOpen; });
});

// ---- Debounce (avoid a localStorage write on every keystroke in long text fields) ----
function debounce(fn, wait){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
}

// ---- Dice ----
function rollDiceStr(str){
  const m = String(str).match(/(\d+)\s*d\s*(\d+)\s*([+-]\s*\d+)?/i);
  if(!m) return null;
  const n=parseInt(m[1]), d=parseInt(m[2]), mod=m[3]?parseInt(m[3].replace(/\s+/g,'')):0;
  let total=mod, rolls=[];
  for(let i=0;i<n;i++){ const r=Math.floor(Math.random()*d)+1; rolls.push(r); total+=r; }
  return {total, rolls, mod, str};
}
function wireDiceButtons(logKey){
  document.querySelectorAll('[data-roll]').forEach(btn=>{
    btn.onclick=()=>{
      const res = rollDiceStr(btn.dataset.roll);
      if(!res) return;
      const out = document.getElementById(btn.dataset.rollout);
      if(out) out.textContent = `${res.total} (${res.rolls.join('+')}${res.mod?(res.mod>0?'+':'')+res.mod:''})`;
      if(logKey){
        const log = get(logKey, []);
        log.unshift(`Rolled ${btn.dataset.roll}${btn.dataset.rolllabel?' — '+btn.dataset.rolllabel:''}: ${res.total}`);
        set(logKey, log.slice(0,60));
        const box = document.getElementById(logKey+'Box');
        if(box) box.innerHTML = log.map(l=>`<div>• ${l}</div>`).join('');
      }
    };
  });
}

// ---- Timer ----
function fmtTime(s){
  if(s<0) s=0;
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
let timerInterval=null;
function tickTimer(){
  const box=document.getElementById('timerBox');
  const disp=document.getElementById('tDisplay');
  if(!box||!disp) return;
  const running = get('timerRunning', false);
  const endAt = get('timerEndAt', null);
  const remaining = get('timerRemaining', 0);
  let secs;
  if(running && endAt){
    secs = (endAt - Date.now())/1000;
    if(secs<=0){ secs=0; set('timerRunning',false); set('timerRemaining',0); clearInterval(timerInterval); timerInterval=null; }
  } else {
    secs = remaining;
  }
  disp.textContent = fmtTime(secs);
  box.classList.toggle('warn', secs>0 && secs<=60);
}
function initTimer(){
  document.getElementById('tMinutes').value = get('timerMinutesInput','');
  tickTimer();
  if(get('timerRunning',false) && !timerInterval){
    timerInterval = setInterval(tickTimer, 1000);
  }
  document.getElementById('tStart').onclick=()=>{
    let remaining = get('timerRemaining', 0);
    if(remaining<=0){
      const mins = parseFloat(document.getElementById('tMinutes').value)||0;
      remaining = mins*60;
    }
    if(remaining<=0) return;
    set('timerRemaining', remaining);
    set('timerEndAt', Date.now()+remaining*1000);
    set('timerRunning', true);
    if(!timerInterval) timerInterval=setInterval(tickTimer,1000);
    tickTimer();
  };
  document.getElementById('tPause').onclick=()=>{
    const running=get('timerRunning',false);
    if(running){
      const endAt=get('timerEndAt',Date.now());
      const remaining=Math.max(0,(endAt-Date.now())/1000);
      set('timerRemaining', remaining);
      set('timerRunning', false);
      clearInterval(timerInterval); timerInterval=null;
    }
    tickTimer();
  };
  document.getElementById('tReset').onclick=()=>{
    set('timerRunning', false);
    set('timerRemaining', 0);
    set('timerEndAt', null);
    clearInterval(timerInterval); timerInterval=null;
    tickTimer();
  };
  document.getElementById('tMinutes').oninput=(e)=>{ set('timerMinutesInput', e.target.value); };
}

function renderNav(active){
  const nav=document.getElementById('nav');
  nav.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.textContent=t;
    if(t===active) b.classList.add('active');
    b.onclick=()=>{ set('activeTab',t); renderAll(); };
    nav.appendChild(b);
  });
}

function checklist(id, items, editableText){
  const checked = get(id, {});
  const overrides = editableText ? get(id+'_txt', {}) : {};
  let html = '<div class="checklist">';
  items.forEach((label,i)=>{
    const key=i+'';
    const text = editableText && overrides[key]!==undefined ? overrides[key] : label;
    const textHtml = editableText
      ? `<span class="editable" contenteditable="true" spellcheck="false" data-clitem="${id}" data-i="${key}" onclick="event.stopPropagation()">${text}</span>`
      : text;
    html+=`<label><input type="checkbox" data-cl="${id}" data-i="${key}" ${checked[key]?'checked':''}> ${textHtml}</label>`;
  });
  html+='</div>';
  return html;
}
function wireChecklists(){
  document.querySelectorAll('input[data-cl]').forEach(cb=>{
    cb.onchange=()=>{
      const id=cb.dataset.cl, i=cb.dataset.i;
      const obj = get(id,{});
      obj[i]=cb.checked;
      set(id,obj);
    };
  });
  document.querySelectorAll('[data-clitem]').forEach(el=>{
    el.onblur=()=>{
      const id=el.dataset.clitem, i=el.dataset.i;
      const obj = get(id+'_txt',{});
      obj[i]=el.textContent.trim();
      set(id+'_txt',obj);
    };
  });
}

// ---- Tension meter (shared pacing tool) ----
const TENSION = [
 {name:"Calm", die:"—", effect:"No lingering tension yet. No mechanical effect — let atmosphere do the work."},
 {name:"Uneasy", die:"d4", effect:"Whenever the party searches a room or tries to rest, roll the Tension Die; on the highest result, a Random Event (see that tab) triggers immediately, no waiting for the clock."},
 {name:"On Edge", die:"d6", effect:"Any PC who witnesses something significant makes a DC13 Wisdom save. Failure: disadvantage on the next attack roll or ability check they make."},
 {name:"Rattled", die:"d8", effect:"DC15 Wisdom save or the Frightened condition until the end of the PC's next turn."},
 {name:"Panicked", die:"d10", effect:"DC17 Wisdom save or the PC's next turn must be spent Dashing away or using the Hide action — no other actions or reactions."},
 {name:"Overwhelmed", die:"d12", effect:"DC19 Wisdom save or the Paralyzed condition until the end of their next turn. An ally within 5 ft can spend an action to snap them out of it, no check required."}
];
function renderTensionMeter(){
  const lvl = get('tensionLevel', 0);
  const d = TENSION[lvl];
  let segs='';
  for(let i=1;i<=5;i++) segs+=`<div class="tensionseg ${i<=lvl?'on':''}" data-tensionseg="${i}" title="Level ${i}"></div>`;
  return `<div class="card">
    <h3 style="margin-top:0">Tension Meter <span class="pctag">Tension Die: ${d.die}</span></h3>
    <p class="smallmuted">Optional pacing tool built entirely from standard 2024 conditions (Frightened, Paralyzed) and Wisdom saves — nothing new to teach the table. Escalate it on big moments, ease it during safe scenes. Delete this card if your game doesn't need it.</p>
    <div class="tensionmeter">${segs}</div>
    <div class="row"><b>${d.name}</b> — ${d.effect}</div>
    <div class="row">
      <button class="act" id="tensionUp">Escalate Tension</button>
      <button class="act" id="tensionDown">Ease Tension</button>
      <button class="act" id="tensionReset">Reset to Calm</button>
    </div>
  </div>`;
}
function wireTensionMeter(){
  const up=document.getElementById('tensionUp');
  if(up) up.onclick=()=>{ set('tensionLevel', Math.min(5,get('tensionLevel',0)+1)); renderAll(); };
  const dn=document.getElementById('tensionDown');
  if(dn) dn.onclick=()=>{ set('tensionLevel', Math.max(0,get('tensionLevel',0)-1)); renderAll(); };
  const rs=document.getElementById('tensionReset');
  if(rs) rs.onclick=()=>{ set('tensionLevel',0); renderAll(); };
  document.querySelectorAll('[data-tensionseg]').forEach(s=>{
    s.onclick=()=>{ set('tensionLevel', parseInt(s.dataset.tensionseg)); renderAll(); };
  });
}

const OVERVIEW_FACTS = [
 ["ov_f0","Setting","Click to describe where and when your campaign takes place."],
 ["ov_f1","Party","e.g. 4 characters, Level 5"],
 ["ov_f2","Central Conflict","What's driving this arc? What do the players want, and what's in the way?"],
 ["ov_f3","Villain","Name and a one-line hook — fill in full details on the Villain tab."],
 ["ov_f4","Villain's Edge","What makes them dangerous, or hard to permanently beat?"],
 ["ov_f5","Current Crisis","What's the ticking clock or immediate threat?"],
 ["ov_f6","Stakes","What happens if the party fails?"],
 ["ov_f7","Ruleset","5th Edition (2024 rules) compatible"]
];
function renderOnboarding(){
  if(get('onboardingDismissed', false)) return '';
  return `<div class="onboarding">
  <h3>New here? Quick orientation</h3>
  <p>This is a blank template — every table cell, card, and paragraph you see is a placeholder you're meant to type over. A few things worth knowing before you start:</p>
  <ul style="margin:0 0 10px;padding-left:20px;">

function getSubsFor(locref){

function setSubsFor(locref, subs){

function getMapFor(locref){

function setMapFor(locref, dataUrl){

  const c=get('customLocations',[]);

let mapFlash = '';
function processMapFile(file, callback){
  if(!file.type.startsWith('image/')){ mapFlash='That file is not an image.'; renderAll(); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1600;
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.82));
    };
    img.onerror = ()=>{ mapFlash='Could not read that image file.'; renderAll(); };
    img.src = e.target.result;
  };
  reader.onerror = ()=>{ mapFlash='Could not read that file.'; renderAll(); };
  reader.readAsDataURL(file);
}

    <p><b>Mechanics:</b> <span class="editable" contenteditable="true" spellcheck="false" data-ctrapmech="${ci}">${t.mech||'Detection and disarm DCs…'}</span></p>
    <p><b>Effect:</b> <span class="editable" contenteditable="true" spellcheck="false" data-ctrapeffect="${ci}">${t.effect||'What happens on trigger…'}</span></p>
    <div class="row">Damage dice: <span class="editable" contenteditable="true" spellcheck="false" data-ctrapdmg="${ci}">${t.dmg||'2d6'}</span>
    <button class="act" data-roll="${t.dmg||'2d6'}" data-rollout="cout_${ci}" data-rolllabel="${t.name}">Roll Damage</button><span class="diceresult" id="cout_${ci}"></span></div>
    </div>`;
  });
  html += `<h3>Encounter Courses (multi-stage set-pieces)</h3>
  <p class="smallmuted">Each course tracks its own stage — click a numbered dot to jump there, or use Advance for a slow build.</p>`;

    html += `<div class="card">
    <h4 style="margin:0 0 4px;color:var(--gold)">${ed('course_'+c.id+'_name',c.name)} <span class="smallmuted">— ${ed('course_'+c.id+'_loc',c.loc)}</span></h4>

  html += `<h3>Horror / Encounter Event Log</h3>

  <div class="log" id="trapLogBox">${(get('trapLog',[])).map(l=>`<div>• ${l}</div>`).join('')}</div>

  return html;

function wireCombat(){
  document.querySelectorAll('[data-preset]').forEach(b=>{

    };
  });
  const addPCs=document.getElementById('addPCsBtn');

  };
  document.querySelectorAll('[data-combinit]').forEach(el=>{
    el.onchange=()=>{

      const c=arr.find(x=>x.id===el.dataset.combinit);
      if(c){ c.init=parseInt(el.value)||0; set('combatants',arr); renderAll(); }
    };
  });
  document.querySelectorAll('[data-combname]').forEach(el=>{
    el.onchange=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combname);
      if(c){ c.name=el.value; set('combatants',arr); }
    };
  });
  document.querySelectorAll('[data-combac]').forEach(el=>{
    el.onchange=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combac);
      if(c){ c.ac=parseInt(el.value)||0; set('combatants',arr); }
    };
  });
  document.querySelectorAll('[data-combmaxhp]').forEach(el=>{
    el.onchange=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combmaxhp);
      if(c){ c.maxhp=parseInt(el.value)||1; set('combatants',arr); renderAll(); }
    };
  });
  document.querySelectorAll('[data-combnotes]').forEach(el=>{
    el.onchange=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===el.dataset.combnotes);
      if(c){ c.notes=el.value; set('combatants',arr); }
    };
  });
  document.querySelectorAll('[data-combdmg]').forEach(b=>{
    b.onclick=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===b.dataset.combdmg);
      const amtEl=document.querySelector(`[data-combamt="${b.dataset.combdmg}"]`);
      const v=parseInt(amtEl.value)||0;
      if(c){ c.hp=Math.max(0,c.hp-v); set('combatants',arr); renderAll(); }
    };
  });
  document.querySelectorAll('[data-combheal]').forEach(b=>{
    b.onclick=()=>{
      const arr=get('combatants',[]);
      const c=arr.find(x=>x.id===b.dataset.combheal);
      const amtEl=document.querySelector(`[data-combamt="${b.dataset.combheal}"]`);
      const v=parseInt(amtEl.value)||0;
      if(c){ c.hp=Math.min(c.maxhp,c.hp+v); set('combatants',arr); renderAll(); }
    };
  });
  document.querySelectorAll('[data-combremove]').forEach(b=>{
    b.onclick=()=>{
      let arr=get('combatants',[]);
      arr=arr.filter(x=>x.id!==b.dataset.combremove);
      set('combatants',arr);
      if(get('combatTurnId',null)===b.dataset.combremove) set('combatTurnId', arr.length? sortedCombatants()[0]?.id : null);
      renderAll();
    };
  });
  const nextBtn=document.getElementById('combatNext');
  if(nextBtn) nextBtn.onclick=()=>{
    const list=sortedCombatants();
    if(!list.length) return;
    const curId=get('combatTurnId',null);
    const idx=list.findIndex(c=>c.id===curId);
    if(idx===-1){
      set('combatTurnId', list[0].id);
    } else if(idx>=list.length-1){
      set('combatTurnId', list[0].id);
      set('combatRound', get('combatRound',1)+1);
    } else {
      set('combatTurnId', list[idx+1].id);
    }
    renderAll();
  };
  const rrb=document.getElementById('combatRoundReset');
  if(rrb) rrb.onclick=()=>{ set('combatRound',1); set('combatTurnId', sortedCombatants()[0]?.id||null); renderAll(); };
  const clearBtn=document.getElementById('combatClearAll');
  if(clearBtn) clearBtn.onclick=()=>{
    set('combatants',[]); set('combatRound',1); set('combatTurnId',null); renderAll();
  };
}

const NPC_STATUSES = [

function getNPCRoster(){

  if(stored) return stored;

  let failDots=''; for(let i=1;i<=3;i++) failDots+=`<div class="rnd fail ${i<=fail?'done':''}" data-trustfail="${i}">${i}</div>`;

// ---- Session Recap Generator ----
function buildRecapSections(){
  const sections = [];
  const locLines = [];
  LOCATIONS.forEach(loc=>{
    const checked = get('loc_'+loc.id, {});
    const overrides = get('loc_'+loc.id+'_txt', {});
    const done = loc.items.map((label,i)=> checked[i+'']? (overrides[i+'']!==undefined?overrides[i+'']:label) : null).filter(Boolean);
    if(done.length){
      const name = get('locName_'+loc.id, loc.name);
      locLines.push(`<b>${name}</b> (${done.length}/${loc.items.length}): ${done.join('; ')}`);
    }
  });
  (get('customLocations',[])).forEach(loc=>{
    const done=(loc.items||[]).filter((t,i)=> loc.checked && loc.checked[i]);
    if(done.length) locLines.push(`<b>${loc.name}</b> (${done.length}/${(loc.items||[]).length}): ${done.join('; ')}`);
  });
  if(locLines.length) sections.push({title:'Locations Progress', lines:locLines});
  const assign = get('goalAssign', {});
  const goalLines = getGoalsList().map(a=> assign[a.id] ? `${assign[a.id]} — ${a.n}` : null).filter(Boolean);
  if(goalLines.length) sections.push({title:'Goals Assigned', lines:goalLines});
  const succ=get('trustSuccesses',0), fail=get('trustFails',0);
  if(succ>0||fail>0){
    let outcome = succ>=3?'Resolved — trust earned.':(fail>=3?'Resolved — trust broken.':'Still in progress.');
    sections.push({title:get('trust_title','NPC Trust Challenge'), lines:[`${succ} success(es), ${fail} fail(s). ${outcome}`]});
  }
  const npcLines = getNPCRoster().filter(n=>n.status!=='neutral').map(n=>`${n.name}: ${n.status==='ally'?'Ally':'Hostile'}`);
  if(npcLines.length) sections.push({title:'NPC Relationships', lines:npcLines});
  const trapLines=[];
  TRAPS.forEach(t=>{
    const trig=get('trap_'+t.id+'_trig',false), disarm=get('trap_'+t.id+'_disarm',false);
    if(trig||disarm) trapLines.push(`${get('trap_'+t.id+'_name',t.name)}: ${disarm?'Disarmed/Bypassed':''}${trig&&disarm?', ':''}${trig?'Triggered':''}`);
  });
  COURSES.forEach(c=>{
    const stage=get('course_'+c.id,0);
    if(stage>0) trapLines.push(`${get('course_'+c.id+'_name',c.name)}: reached Stage ${stage}/${c.stages}`);
  });
  if(trapLines.length) sections.push({title:'Traps & Encounter Courses', lines:trapLines});
  const tensionLvl=get('tensionLevel',0);
  if(tensionLvl>0) sections.push({title:'Tension', lines:[`Currently at "${TENSION[tensionLvl].name}" (${TENSION[tensionLvl].die})`]});
  const pRound=get('purgeRound',0), pLog=get('purgeLog',[]);
  if(pRound>0 || pLog.length){
    const lines=[];
    if(pRound>0) lines.push(`Currently on round ${pRound}/${get('climaxMaxRounds',10)}.`);
    pLog.slice(0,3).forEach(l=>lines.push(l));
    sections.push({title:'Climax', lines});
  }
  const malMax=get('villainMaxHP',100);
  const malHP=get('villainHP', malMax);
  if(malHP < malMax){
    sections.push({title:get('villain_name','Villain'), lines:[`${malHP}/${malMax} HP.${get('villainSignatureTarget','')?(' Signature ability currently on: '+get('villainSignatureTarget','')+'.'):''}`]});
  }
  const secondaryVillains = (get('secondaryVillains',[])).filter(v=>v.hp<v.maxhp);
  if(secondaryVillains.length) sections.push({title:'Secondary Villains', lines: secondaryVillains.map(v=>`${v.name||'Unnamed'}: ${v.hp}/${v.maxhp} HP`)});
  const combatants=get('combatants',[]);
  if(combatants.length) sections.push({title:'Combat Left Mid-Fight', lines:[`Round ${get('combatRound',1)}: `+combatants.map(c=>`${c.name} (${c.hp}/${c.maxhp} HP)`).join(', ')]});
  const partyLines=[];
  (get('partyMembers',[])).forEach(m=>{
    if(m.name) partyLines.push(`${m.name}: ${m.hp}/${m.maxhp} HP${m.exh>0?`, Exhaustion ${m.exh}`:''}`);
  });
  if(partyLines.length) sections.push({title:'Party Status', lines:partyLines});
  return sections;
}
function renderRecap(){
  const sections = buildRecapSections();
  const log = get('sessionRecaps', []);
  let html = `<h2 class="section">Session Recap Generator</h2>
  <p class="smallmuted">Auto-compiled from everything checked, tracked, and logged elsewhere in this document — nothing to fill in by hand. Save one at the end of each session to build a running "story so far."</p>
  <div class="card">
  <h3 style="margin-top:0">Where We Left Off</h3>`;
  if(!sections.length){
    html += '<p class="smallmuted">Nothing tracked yet — as you check off objectives, trigger traps, advance the climax, etc., this recap fills itself in automatically.</p>';
  } else {
    sections.forEach(s=>{
      html += `<h4 style="margin:12px 0 4px;color:#d6a8a0;">${s.title}</h4><ul style="margin:0;font-size:14px;">${s.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
    });
  }
  html += `</div>
  <div class="card">
  <h3 style="margin-top:0">Opening Narration (optional, hand-written)</h3>
  <p class="smallmuted">Write a short in-character "previously on..." to read aloud at the top of next session. This does not auto-update — it's yours to edit.</p>
  ${eb('recapNarration','Click to write your opening narration for next session…')}
  </div>
  <div class="card">
  <h3 style="margin-top:0">Save to Session Log</h3>
  <div class="row">
    <input type="text" id="recapLabel" placeholder="Session label (e.g. Session 3)" value="Session ${log.length+1}" style="flex:1;">
    <button class="act" id="saveRecapBtn">Save Today's Recap</button>
  </div>
  </div>`;
  if(log.length){
    html += `<h3>Session Log (${log.length})</h3>`;
    log.slice().reverse().forEach((entry,ri)=>{
      const i = log.length-1-ri;
      html += `<div class="card">
      <div class="row"><b>${entry.label}</b><span class="smallmuted">${entry.date}</span><button class="del" data-delrecap="${i}">delete</button></div>
      ${entry.sections.map(s=>`<div><b style="color:#d6a8a0;">${s.title}:</b> ${s.lines.join('; ')}</div>`).join('')}
      ${entry.narration?`<div class="readaloud" style="margin-top:8px;">${entry.narration}</div>`:''}
      </div>`;
    });
  }
  return html;
}
function wireRecap(){
  const saveBtn=document.getElementById('saveRecapBtn');
  if(saveBtn) saveBtn.onclick=()=>{
    const label=document.getElementById('recapLabel').value.trim()||('Session '+(get('sessionRecaps',[]).length+1));
    const sections=buildRecapSections();
    const narration=get('recapNarration','');
    const log=get('sessionRecaps',[]);
    log.push({label, date:new Date().toLocaleDateString(), sections, narration: narration==='Click to write your opening narration for next session…'?'':narration});
    set('sessionRecaps', log);
    renderAll();
  };
  document.querySelectorAll('[data-delrecap]').forEach(b=>{
    b.onclick=()=>{
      const log=get('sessionRecaps',[]);
      const idx=parseInt(b.dataset.delrecap);
      if(!confirm(`Delete "${log[idx]?.label||'this session recap'}" from the log? This cannot be undone.`)) return;
      log.splice(idx,1);
      set('sessionRecaps',log);
      renderAll();
    };
  });
}

function doExportBackup(){
  const payload = { schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), state: state };
  const dataStr = JSON.stringify(payload, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const titleSlug = (get('sessionTitle','dm_screen')||'dm_screen').replace(/[^a-z0-9]+/gi,'_').toLowerCase();
  const dateSlug = new Date().toISOString().slice(0,10);
  a.download = `${titleSlug}_backup_${dateSlug}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  <div class="card">
  <h3 style="margin-top:0">Start a Fresh Campaign</h3>
  <p class="smallmuted">This is how anyone else picks up this same file and sets it up for their own table: wipes every checkbox, HP change, note, and log from this browser and reverts every tab back to its original blank template — nothing deleted from the file itself, only from this browser's saved progress. <b>Download a backup first if you want to keep what's here.</b></p>
  <button class="act" id="resetAllBtn" style="border-color:var(--redbright);color:#f3c8c8;">Reset Everything to Blank</button>
  </div>
  `;
}
function wireBackup(){
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick=doExportBackup;
  const importBtn=document.getElementById('importBtn');
  if(importBtn) importBtn.onclick=()=>{
    const fileInput=document.getElementById('importFile');
    const file=fileInput.files[0];
    if(!file){ importFlash='Choose a .json backup file first.'; renderAll(); return; }
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(parsed && typeof parsed==='object' && parsed.state && typeof parsed.state==='object'){
          if(typeof parsed.schemaVersion==='number' && parsed.schemaVersion>SCHEMA_VERSION){
            importFlash=`Restored — but this backup was made with a newer template (schema v${parsed.schemaVersion}) than this file (v${SCHEMA_VERSION}). Some newer fields may not display correctly here; consider downloading the latest template.`;
          } else {
            importFlash='Backup restored successfully.';
          }
          state=parsed.state;
        } else if(parsed && typeof parsed==='object'){
          state=parsed;
          importFlash='Backup restored (older unversioned file — worked fine, but re-exporting will upgrade it to the current format).';
        } else {
          throw new Error('unrecognized backup shape');
        }
        save();
      }catch(err){
        importFlash='Could not read that file — is it a valid backup .json?';
      }
      renderAll();
    };
    reader.onerror=()=>{ importFlash='Could not read that file.'; renderAll(); };
    reader.readAsText(file);
  };
  const resetBtn=document.getElementById('resetAllBtn');
  if(resetBtn) resetBtn.onclick=()=>{
    if(!confirm('This permanently erases all saved progress in this browser — every checkbox, HP change, note, and log. This cannot be undone. Continue?')) return;
    state={};
    save();
    renderAll();
  };
}

function renderAll(){
  const active = get('activeTab','Overview');
  renderNav(active);
  const main = document.getElementById('main');
  let html='';
  if(active==='Overview') html=renderOverview();
  else if(active==='Goals & Secrets') html=renderGoals();
  else if(active==='Locations') html=renderLocations();
  else if(active==='Traps & Encounters') html=renderTraps();
  else if(active==='Random Events') html=renderWandering();
  else if(active==='Climax Tracker') html=renderPurge();
  else if(active==='Combat Tracker') html=renderCombat();
  else if(active==='Villain') html=renderMaligno();
  else if(active==='Stat Blocks') html=renderStatblocks();
  else if(active==='Party Tracker') html=renderParty();
  else if(active==='NPC Relationships') html=renderNPCTrust();
  else if(active==='Session Recap') html=renderRecap();
  else if(active==='Notes') html=renderNotes();
  else if(active==='Backup & Setup') html=renderBackup();
  main.innerHTML = html;
  wireEditables();
  wireChecklists();
  const dismissBtn=document.getElementById('dismissOnboardingBtn');
  if(dismissBtn) dismissBtn.onclick=()=>{ set('onboardingDismissed', true); renderAll(); };
  if(active==='Goals & Secrets') wireGoals();
  if(active==='Locations') wireLocations();
  if(active==='Traps & Encounters') wireTraps();
  if(active==='Random Events') wireWandering();
  if(active==='Climax Tracker') wirePurge();
  if(active==='Combat Tracker') wireCombat();
  if(active==='Villain') wireMaligno();
  if(active==='Stat Blocks') wireStatblocks();
  if(active==='Party Tracker') wireParty();
  if(active==='NPC Relationships') wireNPCTrust();
  if(active==='Session Recap') wireRecap();
  if(active==='Notes') wireNotes();
  if(active==='Backup & Setup') wireBackup();
  applyEditLock();
}
initHeader();
initTimer();
updateStorageBanner();
renderAll();
</script>
